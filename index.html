n dans le premier onglet \"Listing Solutions\" de notre listing Excel de mise à jour :\nFRANCE\nO TACOS FR+LUX - Rapport d'intervention.xlsx\nDROM\nO TACOS DROM - Rapport d'intervention.xlsx\nNOUVELLE CALÉDONIE\nO TACOS NOUVELLE CALEDONIE - Rapport d'intervention.xlsx\nBELGIQUE FR\nO TACOS BE-FR - Rapport d'intervention.xlsx\nBELGIQUE NL\nO TACOS BE-NL - Rapport d'intervention.xlsx\nITALIE\nO TACOS IT - Rapport d'intervention.xlsx\nESPAGNE\nO TACOS ES - Rapport d'intervention.xlsx\nALLEMAGNE\nO TACOS DE - Rapport d'intervention.xlsx\nSUISSE\nO TACOS CH - Rapport d'intervention.xlsx\nMAROC\nO TACOS MAROC - Rapport d'intervention.xlsx\nPARAMÉTRAGE ÉTIQUETTE PERSONNALISÉE SUR EPACK MANAGER\nI/ Se rendre sur le BackOffice de la nouvelle solution et cliquer sur le bouton permettant d'ajouter des modules :\nII/ Ajouter le module \"ÉTIQUETTE PERSONNALISÉE\" et le renommer en fonction de la langue :\nPays francophones (FR-LUX / BE-FR / CH / ANTILLES / MAROC / NOUVELLE CALEDONIE / REUNION) : \" Temps dans le meuble / Refroi. rapide / Décong. \"\nBE-NL : \" Prod. tijd / Koelen / Ontdooien \"\nDE : \" Prod.-Zeit / Kühlung / Auftauen \"\nES : \" Post-Coc / Refrig. / Descong. \"\nIT : \" Scadenze Banco / Ambientam. / Scongel. \"\nIII/ Importation des modèles étiquettes étiquettes personnalisées :\n1- Se rendre sur le BackOffice de la solution nouvellement produite et récupérer son numéro de solution (ici : 20230421013 ), puis se rendre dans le menu « Administration » .\n2- Sélectionner le menu « Copier une étiquette perso d'une solution vers un batch de solutions » .\n3- Configurer le menu de la manière suivante :\n- Renseigner la solution source en fonction de la langue :\nFR / BE-FR / REUNION / NOUVELLE-CALEDONIE / ANTILLES / CH / MAROC : 20241224459\nBE-NL : 20211019481\nIT : 20250109237\nDE : 20230607940\n- Sélectionner l'option \" Champ texte \"\n- Renseigner le n° de solution de la solution nouvellement produite (ici : 20230421013 )\n- Sélectionner l'option \" Copier les produits — copier également les produits (et leurs champs) de chaque étiquette \"\n- Cliquer sur le bouton \" Valider \"\n4- Attendre la fin de la synchronisation de la solution, puis vérifier que le module est bien alimenté avec les produits.\nIV/ Importation des étiquettes produits :\n- Se connecter au compte update en fonction de la langue et du pays de destination :\nFR : https://backoffice.epack-manager.com/epack/manager/user/21531\nBE-FR : https://backoffice.epack-manager.com/epack/manager/user/21532\nBE-NL : https://backoffice.epack-manager.com/epack/manager/user/21533\nIT : https://backoffice.epack-manager.com/epack/manager/user/21534\nDE : https://backoffice.epack-manager.com/epack/manager/user/26778\nCH : https://backoffice.epack-manager.com/epack/manager/user/29787\nNC : https://backoffice.epack-manager.com/epack/manager/user/31697\nMAROC : https://backoffice.epack-manager.com/epack/manager/user/32810\nANTILLES : https://backoffice.epack-manager.com/epack/manager/user/28979\nREUNION : https://backoffice.epack-manager.com/epack/manager/user/43357\n2. Cliquer sur le bouton \" Déployer des XML \"\n3. Sélectionner la solution nouvellement produite (ici : 20230421013 ) et cliquer sur \" Continuer \"\n4. Sélectionner l'option \" Remplacer \"\n5. Sélectionner le fichier ProductStickers en fonction de la langue :\nFR : https://epack.sharepoint.com/:u:/s/STU/IQCeLwM2_Js0RpEvC-WRMMU-AYxd_DWJQvUuCXzM9DijmGM?e=ptTa2d\nBE-FR : https://epack.sharepoint.com/:u:/s/STU/IQC3jRiSjAH7TL34s_jR1mI5Aaokj8vIZwSptwSZlSh59Ps?e=LZ05e2\nBE-NL : https://epack.sharepoint.com/:u:/s/STU/IQBnBv5aGGc6Rp1UjIFiDtwBAW8Y8hCXMdngcVB5EmSCgKA?e=1uXmf2\nIT : https://epack.sharepoint.com/:u:/s/STU/IQAR5n95RXqfSodUwDOKX2hEAYXifKjZctyPHjvF-NRDD4I?e=qc4Ac5\nDE : https://epack.sharepoint.com/:u:/s/STU/IQBZGswJcEPRToYufHxpRbn4AffhRBziI1mEi4ZkAPzStUw?e=HKcjOC\nCH : https://epack.sharepoint.com/:u:/s/STU/IQCHWDP6GoYbQqOQ2CRfadM4AYk0NQ7_HiQ2_SQ539Ij5RA?e=idRbCf\nNC : https://epack.sharepoint.com/:u:/s/STU/ ATELIER PAPILLES\nupdateatoanne@epack-hygiene.fr\n46"}, "history": []}, {"id": "gctotal-motorway", "updatedAt": 1793354024560, "group": {"name": "TOTAL MOTORWAY", "multiBrand": false, "brands": [""], "multiZone": true, "zones": ["Cafe Bonjour", "Shoppi"], "sfSame": true, "sfDiff": "", "sfa": "SFA005245", "sfLink": "https://chr-numerique.lightning.force.com/lightning/r/Account/0010N00004cFERXQA4/view"}, "contacts": [{"firstName": "Adeline", "lastName": "ANCEL", "role": "", "email": "adeline.ancel@totalenergies.com", "phone": "", "scope": [], "account": ""}], "internal": {"qm": [], "csm": ["Gerda MEVEL-DE BACKER"], "cp": "", "sales": "", "others": []}, "commercial": {"frameContract": false, "priceRef": "", "prices": [], "consumables": [], "consumableNote": "", "history": ""}, "deploy": {"sitesEquipped": "", "sitesToEquip": "", "cadence": "", "planningUrl": "", "planningFreq": "", "planningRecipient": "", "planningHide": "", "refSiteProvided": false, "refSite": ""}, "tech": {"paramTypeUrl": "https://epack.sharepoint.com/:f:/s/STU/Es6Z1_pgvXJNtghc1MoSlvkBu9Vibl3fl7RP5jki8kKXWg?e=f1gSPs", "paramLangs": "", "modules": [], "moduleScope": "common", "zoneModules": {}, "recurrences": "", "managerAccounts": [], "updateAccount": "updatetotalmotorwayshoppifr@epack-hygiene.fr, updatetotalmotorwaycafebonjourfr@epack-hygiene.fr, updatetotalmotorwaycafebonjourde@epack-hygiene.fr", "listingUrl": "https://epack.sharepoint.com/:x:/s/STU/EfVcErigVJ1HkqBR4zFlH8EB2Lg3-sY8Gw1Pc1dYzui8wA?e=wVo3cT", "vigilance": [], "note": "=== Infos SGC (Portail Notion) ===\nStatut fiche : À vérifier (derniere MaJ Notion 01/10/2025)\nParams variables autorises : Frigos, Utilisateurs\nModule custom : Non\nGroupement Salesforce : (non renseigné)\n\n(Repris de Documize - PRODUCTION/Verification solution avant depart. A verifier et completer.)\n\nParamétrages types disponibles selon type de point de vente \"CAFÉ BONJOUR\" ou \"SHOPPI\" et selon langue pour point de vente CAFÉ BONJOUR (FR ou DE) :\nLIEN SHAREPOINT PARAMS TYPES\nModifications des paramétrages autorisés :\nEPACK-[TYPE DE MATERIEL] [NOM DU GROUPE] [VILLE] [TYPE POINT DE VENTE]\nEx : EPACK-AIO TOTAL MARTELANGE CB (pour CAFÉ BONJOUR)\nEPACK-AIO TOTAL PONTPIERRE SHOPPI CB (pour SHOPPI)\nEx : TOTAL MARTELANGE\nLes types de points de vente sont :\n- CB = Café Bonjour\n- SHOPPI = Shoppi (ces sites comprennent l'étiquetage SHOPPI + CAFÉ BONJOUR)\nSuper Admin\nAdeline ANCEL\nadeline.ancel@totalenergies.com\nAssigner également notre « compte ePack manager Update » à la solution selon le type de point de vente et selon la langue :\nSHOPPI\nEPACK MISE A JOUR TOTAL MOTORWAY SHOPPI\nupdatetotalmotorwayshoppifr@epack-hygiene.fr\nCAFÉ BONJOUR\nFRANCOPHONE\nEPACK MISE A JOUR TOTAL MOTORWAY CAFE BONJOUR FR\nupdatetotalmotorwaycafebonjourfr@epack-hygiene.fr\nGERMANOPHONE\nEPACK MISE A JOUR TOTAL MOTORWAY CAFE BONJOUR DE\nupdatetotalmotorwaycafebonjourde@epack-hygiene.fr\nRajouter la nouvelle solution dans le premier onglet \"Listing Solutions\" de notre listing Excel de mise à jour :\nTOTAL MOTORWAY - Liste solutions.xlsx\nPARAMÉTRAGE ÉTIQUETAGE V2 EPACK MANAGER\nI/ Se rendre sur l’espace Manager de la nouvelle solution.\nII/ Importation des modèles étiquettes Etiquetage V2 :\n- Sur la solution, se rendre dans l’onglet « Paramètre »\n- « Afficher les modules masqués » pour pouvoir accéder au paramétrage « Produit Etiquetage » (Si le module Etiquetage n’est pas encore visible)\nIII/ Importation des différents modèles étiquettes :\n- Bouton ajouter\n- Cliquer sur le petit icone « Stylo » pour ouvrir la fenêtre d’importation des modèles étiquettes.\n- Ajouter un modèle en appuyant sur le bouton « + »\n- Dans la rubrique «  Choisissez un template d'étiquette au format xml » :\nFaite glisser ou aller chercher votre modèle étiquette via le chemin réseau :\nModèle(s) étiquette\n/!\\ Dans cet exemple, il s’agit du paramétrage SHOPPI  /!\\\nChaque pays a son propre paramétrage à récupérer dans son dossier paramétrage type « epack hygiene3\\documents\\.ignore\\Etiquetage\\55x29 »\n- Nommer l’étiquette dans la partie « libellé du type étiquette » avec la même désignation que le modèle étiquette.\n- Valider l’opération : Vous devriez voir votre modèle étiquette apparaitre sur le côté gauche.\n/!\\ Il se peut que vous deviez également uploader une image/logo /!\\\nC'est disponibles ici :\nImage(s) modèle(s) étiquette\n- Faites cette opération pour l’ensemble des modèles étiquette :\n/!\\ Selon le type du module étiquetage (SHOPPI ou CAFÉ BONJOUR) : les modèles, leur nombre et leur image changent. /!\\\nIV/ Création d’un champ personnalisé\nLe module étant composé de 3 étiquetages différents (regroupé dans un seul fichier Excel de paramétrage) , nous devons créer une Variable personnalisé « moduleCode »qui permettra  à l’application de les différencier :\n- Dans « Produit Etiquetage », se rendre dans la rubrique « Ajouter un Champ personnalisé »\n- « Créer ou modifier un champ personnalisé »\n- Libellé : moduleCode\nValeur par défaut : « »  (Il faut mettre un  « espace » : Voir capture ci-dessous)\nType : Texte\nCode sur le modèle étiquette : moduleCode\nStyle de mise en forme : Normal\nV/ Importation du listing de paramétrage Etiquetage V2 :\n- Récupérer la dernière version à jour :\nLIEN SHAREPOINT PARAMS TYPES\nLe fichier Excel de paramétrage Etqv2 sera toujours disponible et à jour dans ce dossier paramétrage type avec le code de la langue désiré.\n- Bouton « Importer », au niveau du paramétrage « Produit Etiquetage »\n- Importer le fichier Excel de paramétrage en utilisant la fonction « Remplacer » :\n- Le listing doit apparaitre comme ci-dessous lorsque l’importation s’est correctement déroulée :\n- Depuis le BACKOFFICE de la solution, il faudra attendre que les opérations en file d’attente tombent à « 0 » (= synchro OK)\nUne fois les opérations en file d’attente traitées et à zéro, faire un test d’impression des différents modules étiquetage.\n45"}, "history": []}, {"id": "gcussim", "updatedAt D, Checklists, Utilisateurs, Fournisseurs, Suivi des huiles\nModule custom : Oui - Guide d'utilisation ; Enquête de satisfaction convives (lien dans « Lien URL module custom.xlsx », SharePoint STU)\nGroupement Salesforce : (compte update dédié, voir détail)\nSpecificite support : accès paramètres réservé au chef (mot de passe = n° de site précédé de 0) · module TEMPÉRATURE DE DISTRIBUTION à adapter · SAV : prévenir le CSM.\n\n(Repris de Documize - PRODUCTION/Verification solution avant depart. A verifier et completer.)\n\nParamétrage type disponible :\nLIEN SHAREPOINT PARAMS TYPES\n/!\\ ATTENTION /!\\\nSeul le chef a accès aux paramétrages et gestion des utilisateurs, son profil est bloqué par un mot de passe.\nIl s'agit du numéro du site précédé par des 0.\nPar ex:\nsite 152 -> code 0152\nsite SR25 -> code 0025\nDans le brief du 1er rdv, il est demandé au CA de préciser les éventuels points de distribution sur site. Lorsqu’ils sont présents sur le param, il faut préciser à la prod d’en tenir compte pour le module TEMPERATURE DE DISTRIBUTION.\nIl faut supprimer les noms de catégories du param type et les remplacer par les points de distribution récoltés lors du rdv de param par le CA.\nSPÉCIFICITÉ DU PARAMÉTRAGE :\n> Checklists type + checklists variables :\nDans le configurateur, il faut d'abord importer les checklists du paramétrage type (dispo ici : VITALREST - CHECKLIST TYPE.csv ), puis importer celles fournies par le QM.\n> Module custom : \"ENQUÊTE DE SATISFACTION CONVIVES\" :\nLe lien du module custom est différents pour chaque sites. Il convient donc de modifier le lien du module en y ajoutant le code de l'établissement en fin d'URL.\nAfin de savoir si le site doit recevoir ou non le module, merci de vérifier que le site se trouve bien dans cette liste : Lien URL module custom.xlsx\n(si le site n'est pas renseigné, le module ne doit pas être ajouté )\nExemple :\nNom du site : VITALREST - A32 - MAISON DES POETES\nLien du module :\nhttps://eu5se.voxco.com/S2/? /* ---- Système de copier/coller partage (comme le plugin) ---- */
window.eppMakeCopyBtn=function(val){
  var b=document.createElement('button'); b.type='button'; b.className='epp-cell-copy'; b.title='Copier'; b.setAttribute('aria-label','Copier');
  b.innerHTML='<svg viewBox="-16 0 448 512" aria-hidden="true"><path d="M320 448H64V128h64V96H32c-17.7 0-32 14.3-32 32v352c0 17.7 14.3 32 32 32h288c17.7 0 32-14.3 32-32v-64h-32v64zM384 0H160c-17.7 0-32 14.3-32 32v320c0 17.7 14.3 32 32 32h224c17.7 0 32-14.3 32-32V32c0-17.7-14.3-32-32-32z"/></svg>';
  b.addEventListener('click',function(e){ e.preventDefault(); e.stopPropagation();
    function done(){ var o=b.innerHTML; b.innerHTML='<span class="epp-copy-ok">OK</span>'; setTimeout(function(){ b.innerHTML=o; },900); }
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(val).then(done,function(){ done(); });
    else { var ta=document.createElement('textarea'); ta.value=val; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(x){} document.body.removeChild(ta); done(); }
  });
  return b;
};
/* Pose un bouton copier après chaque [data-copy] non traite (idempotent). */
window.eppWireCopy=function(root){
  (root||document).querySelectorAll('[data-copy]').forEach(function(el){
    if(el.getAttribute('data-copy-done')==='1') return; el.setAttribute('data-copy-done','1');
    var v=el.getAttribute('data-copy'); if(!v||v==='-'||v==='—') return;
    var btn=window.eppMakeCopyBtn(v); el.parentNode.insertBefore(btn, el); // bouton TOUJOURS a gauche de son contenu
  });
};

window.eppFlash=function(message,opts){
  opts=opts||{};
  var bar=document.getElementById('eppFlashbar');
  if(!bar){ bar=document.createElement('div'); bar.className='epp-flashbar'; bar.id='eppFlashbar';
    var m=document.querySelector('.main'); if(m) m.insertBefore(bar,m.firstChild); else document.body.appendChild(bar); }

  bar.appendChild(it);

};

function isEN(){ return document.documentElement.classList.contains('epp-lang-en'); }
function render(){
  var en=isEN()?1:0;

  document.querySelectorAll('[data-i18n-ph]').forEach(function(el){ var t=I18N[el.getAttribute('data-i18n-ph')]; if(t) el.setAttribute('placeholder',t[en]); });
  document.querySelectorAll('[data-i18n-title]').forEach(function(el){ var t=I18N[el.getAttribute('data-i18n-title')]; if(t) el.setAttribute('title',t[en]); });

}

/* ---- Theme / Langue / Sidebar ---- */
function wireSwitches(){
  var html=document.documentElement;
  // theme (déjà applique tot par le head pour eviter le flash)
  var st=document.getElementById('switch_theme');
  /* WebKit ne redessine pas les scrollbars au changement de classe -> forcer un reflow de la scrollbar de page. */
  function repaintScrollbars(){ try{ html.style.overflowY='hidden'; void html.offsetHeight; html.style.overflowY=''; }catch(e){} }
  function toggleTheme(){ var d=html.classList.toggle('epp-dark'); try{localStorage.setItem('eppTheme',d?'dark':'light');}catch(e){} repaintScrollbars(); }
  st.addEventListener('click',toggleTheme);
  st.addEventListener('keydown',function(e){ if(e.key===' '||e.key==='Enter'){e.preventDefault();toggleTheme();} });
  // langue
  var sl=document.getElementById('switch_lang');
  function toggleLang(){ var en=!isEN(); html.classList.toggle('epp-lang-en',en); try{localStorage.setItem('eppLang',en?'en':'fr');}catch(e){} render(); }
  try{ if(localStorage.getItem('eppLang')==='en') html.classList.add('epp-lang-en'); }catch(e){}
  sl.addEventListener('click',toggleLang);
  sl.addEventListener('keydown',function(e){ if(e.key===' '||e.key==='Enter'){e.preventDefault();toggleLang();} });
  // sidebar
  var app=document.getElementById('app'), cb=document.getElementById('collapseBtn');
  try{ if(localStorage.getItem('eppSideCollapsed')==='1') app.classList.add('sb'); }catch(e){}
  if(cb) cb.addEventListener('click',function(){ var c=app.classList.toggle('sb'); try{localStorage.setItem('eppSideCollapsed',c?'1':'0');}catch(e){} });
  // menu utilisateur (avatar) : ouvre/ferme le cadre des switchs
  var ub=document.getElementById('userBtn'), um=document.getElementById('userMenu');
  if(ub && um){
    function closeUser(){ um.classList.remove('open'); ub.classList.remove('open'); ub.setAttribute('aria-expanded','false'); }
    ub.addEventListener('click',function(e){ e.stopPropagation(); var o=um.classList.toggle('open'); ub.classList.toggle('open',o); ub.setAttribute('aria-expanded',o?'true':'false'); });
    document.addEventListener('click',function(e){ if(um.classList.contains('open') && !e.target.closest('#userMenu') && !e.target.closest('#userBtn')) closeUser(); });
    document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeUser(); });
    um.addEventListener('mouseleave',closeUser); // se referme quand la souris quitte le menu
  }
}

    'Asia/Shanghai':'cn','Asia/Hong_Kong':'hk','Asia/Singapore':'sg','Asia/Kolkata':'in','Asia/Seoul':'kr','Asia/Bangkok':'th','Asia/Jakarta':'id',
    'Asia/Tel_Aviv':'il','Asia/Jerusalem':'il','Australia/Sydney':'au','Australia/Perth':'au','Pacific/Auckland':'nz',
    'Africa/Cairo':'eg','Africa/Lagos':'ng','Africa/Nairobi':'ke','Africa/Tunis':'tn','Africa/Algiers':'dz','Africa/Dakar':'sn'
  };
  /* Lieu + drapeau de l'horloge locale (modale engrenage). Exceptions regionales via le drapeau. */
  var LOCTZ_KEY='eppLocalTz', LOCFLAG_KEY='eppLocalFlag', locTz=null, locFlagOverride=null;

  function detectedTz(){ try{ return Intl.DateTimeFormat().resolvedOptions().timeZone; }catch(e){ return 'Europe/Paris'; } }
  function localTzNow(){ return locTz || detectedTz(); }
  /* Cartes indexees par NOM de lieu (pas par fuseau) -> Quebec reste Quebec (meme fuseau que Toronto), drapeau regional conserve. */
  var CLK=window.EPP_CLOCKS||null;
  var COUNTRY_PLACES={ 'France':{tz:'Europe/Paris',flag:'fr',en:'France'}, 'Maroc':{tz:'Africa/Casablanca',flag:'ma',en:'Morocco'}, 'Espagne':{tz:'Europe/Madrid',flag:'es',en:'Spain'}, 'Italie':{tz:'Europe/Rome',flag:'it',en:'Italy'}, 'Dubai':{tz:'Asia/Dubai',flag:'ae',en:'Dubai'} };
  function nameTz(name){ if(COUNTRY_PLACES[name]) return COUNTRY_PLACES[name].tz; if(CLK && CLK.BYNAME[name]) return CLK.BYNAME[name]; return name; }

  function nameLabel(name){ if(!en()) return name; if(COUNTRY_PLACES[name]) return COUNTRY_PLACES[name].en; if(CLK && CLK.nameOf) return CLK.nameOf(name,1); return name; }
  function ccFor(tz){ if(tz==='Local') return TZCC[localTzNow()]||'fr'; return TZCC[tz]||null; }
  function flagUrl(tz){ if(tz==='Local' && locFlagOverride) return '../flags/'+locFlagOverride+'.svg'; var c=ccFor(tz); return c?('../flags/'+c+'.svg'):null; }
  var CONT={Africa:['Afrique','Africa'],America:['Amerique','America'],Antarctica:['Antarctique','Antarctica'],Arctic:['Arctique','Arctic'],Asia:['Asie','Asia'],
    Atlantic:['Atlantique','Atlantic'],Australia:['Australie','Australia'],Europe:['Europe','Europe'],Indian:['Ocean Indien','Indian Ocean'],Pacific:['Pacifique','Pacific'],Etc:['UTC','UTC']};

  var html=document.documentElement;
  var grid=document.getElementById('clock-grid'), input=document.getElementById('tz-input'), results=document.getElementById('tz-results'), countEl=document.getElementById('clock-count');
  var pill=document.getElementById('locClockBtn'), pop=document.getElementById('clockPop');
  var locTime=document.getElementById('locTime'), locDate=document.getElementById('locDate'), locFlag=document.getElementById('locFlag');
  if(!grid) return;
  function en(){ return html.classList.contains('epp-lang-en')?1:0; }
  function loc(){ return en()?'en-US':'fr-FR'; }

  var active=null; try{ active=JSON.parse(localStorage.getItem('worldClocks_v2'))||null; }catch(e){}
  /* Migration : anciens états enregistres par FUSEAU -> NOM de lieu (ex "Asia/Dubai" -> "Dubai"), drop du token "Local". */
  if(active && CLK){ active=active.map(function(e){ if(e==='Local') return null; if(typeof e==='string' && e.indexOf('/')>=0) return CLK.BYTZ[e]||null; return e; }).filter(Boolean);
    active=active.filter(function(e,i){ return active.indexOf(e)===i; }); }
  if(!active || !active.length) active=['France','Maroc','Espagne','Italie','Dubai'];
  /* Toujours inclure le lieu local ; s'il partage le fuseau d'un lieu déjà liste, pas de doublon (ce lieu sera marque "locale"). */
  (function(){ var lz=localTzNow(); for(var i=0;i<active.length;i++){ if(nameTz(active[i])===lz) return; }
    var nm=null; try{ nm=localStorage.getItem('eppLocalPlace'); }catch(e){} nm=nm||(CLK&&CLK.BYTZ[lz])||lz; active.push(nm); })();
  /* Preference : afficher ou non l'horloge locale dans la liste (defaut : oui). */
  var showLocal=true; try{ showLocal=localStorage.getItem('eppShowLocal')!=='0'; }catch(e){}
  var needBuild=true;

  function tzOffset(tz){ var now=new Date(); if(tz==='Local') tz=localTzNow();
    try{ var p=new Intl.DateTimeFormat('en-US',{timeZone:tz,hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'})
      .formatToParts(now).reduce(function(a,x){a[x.type]=x.value;return a;},{});
      return Math.round((Date.UTC(p.year,p.month-1,p.day,p.hour,p.minute,p.second)-now.getTime())/60000);
    }catch(e){ return 0; } }
  function cityLabel(tz){ if(tz==='Local') return customNames.Local[en()]; if(customNames[tz]) return customNames[tz][en()]; var p=tz.split('/'); return p[p.length-1].replace(/_/g,' '); }
  function offLabel(tz){ var m=tzOffset(tz),s=m>=0?'+':'-',a=Math.abs(m),h=Math.floor(a/60),mm=a%60; return 'UTC'+s+h+(mm?(':'+String(mm).padStart(2,'0')):''); }
  function zoneLabel(tz){ var r=CONT[tz.split('/')[0]]; r=r?r[en()]:tz.split('/')[0]; return cityLabel(tz)+' - '+r+' ('+offLabel(tz)+')'; }
  function save(){ try{ localStorage.setItem('worldClocks_v2',JSON.stringify(active)); }catch(e){} }

  function build(){
    active.sort(function(a,b){ return tzOffset(nameTz(a))-tzOffset(nameTz(b)); }); save();
    grid.innerHTML='';
    var lz=localTzNow(), localDone=false;
    active.forEach(function(name,i){
      var tz=nameTz(name);
      /* Si une horloge ajoutee partage le fuseau de la locale, on n'en affiche qu'UNE (la locale). Le doublon est masque, et reapparait si la locale change. */
      if(tz===lz && localDone) return;
      var isLocal=(!localDone && tz===lz); if(isLocal){ localDone=true; if(!showLocal) return; } // locale masquee si le toggle est off
      var fu='../flags/'+((isLocal && locFlagOverride)?locFlagOverride:nameFlag(name))+'.svg';
      var c=document.createElement('div'); c.className='clock-card'+(isLocal?' local':''); c.id='clock-'+i;
      c.innerHTML='<img class="cflag" src="'+fu+'" alt="">'+
        '<div class="city">'+nameLabel(name)+'</div><div class="time">--:--:--</div><div class="date">--</div>'+
        (isLocal ? '<span class="pin-local" title="'+(en()?'Your location':'Votre position')+'">'+PIN_SVG+'</span>'
                 : '<button class="btn-del" data-index="'+i+'" title="'+(en()?'Remove':'Retirer')+'" aria-label="'+(en()?'Remove':'Retirer')+'">'+TRASH_SVG+'</button>');
      grid.appendChild(c);
    });
    needBuild=false;
  }
  function tick(){
    if(needBuild) build();
    var now=new Date();
    active.forEach(function(name,i){ var c=document.getElementById('clock-'+i); if(!c) return; var tz=nameTz(name);
      var ot={hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false,timeZone:tz}, od={weekday:'short',day:'numeric',month:'short',timeZone:tz};
      c.querySelector('.time').textContent=now.toLocaleTimeString(loc(),ot);

    var lz=localTzNow(), lt={hour:'2-digit',minute:'2-digit',hour12:false}, ld={weekday:'short',day:'numeric',month:'short'};

    if(locTime) locTime.textContent=now.toLocaleTimeString(loc(),lt);
    if(locDate) locDate.textContent=now.toLocaleDateString(loc(),ld);

    if(lf && locFlag && locFlag.getAttribute('src')!==lf) locFlag.setAttribute('src',lf);
  }
  function addTz(tz){ if(tz&&active.indexOf(tz)<0){ active.push(tz); save(); needBuild=true; tick(); } }
  function removeClock(i){ active.splice(i,1); save(); needBuild=true; tick(); }

  function allZones(){ try{ if(typeof Intl.supportedValuesOf==='function') return Intl.supportedValuesOf('timeZone'); }catch(e){} return Object.keys(customNames).filter(function(k){return k!=='Local';}); }
  var zones=allZones();
  /* Catalogue de lieux porte du plugin (villes + regions, drapeaux regionaux). Fallback : fuseaux IANA. */
  /* Normalisation : minuscules, sans accents, sans espaces/traits d'union -> "Taiwan"=="Taïwan", "Vietnam"=="Viêt Nam", "new york"=="New York". */
  function norm(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,''); }
  /* Libelle résultat bilingue : "Pays / Ville - Zone (UTC±)" (sans doublon si pays == ville). */
  function placeLabel(l){ var e=en(); var city=e?(l.nameEn||l.name):l.name; var country=e?(l.countryEn||l.country||''):(l.country||'');
    var region=CLK.regionOfLang?CLK.regionOfLang(l.tz,e):CLK.regionOf(l.tz); var off=CLK.offsetLabel(l.tz);

    return head+' - '+region+' ('+off+')'; }
  function searchPlaces(q){ q=norm((q||'').trim()); if(!q) return [];
    if(CLK){ return CLK.LIEUX.filter(function(l){ return l.tz!=='Local' && (norm(l.name).indexOf(q)>=0 || (l.nameEn&&norm(l.nameEn).indexOf(q)>=0) || (l.country&&norm(l.country).indexOf(q)>=0) || (l.countryEn&&norm(l.countryEn).indexOf(q)>=0) || norm(l.tz.replace(/_/g,' ')).indexOf(q)>=0); })
      .slice(0,80).map(function(l){ return {name:l.name, tz:l.tz, label:placeLabel(l)}; }); }

  }
  function renderResults(){ if(input.parentNode) input.parentNode.classList.toggle('has-val', !!input.value); results.innerHTML=''; var m=searchPlaces(input.value);

  function closePop(){ pop.classList.remove('open'); pill.classList.remove('open'); pill.setAttribute('aria-expanded','false'); results.style.display='none'; try{localStorage.setItem('eppClockPop','0');}catch(e){} }
  pill.addEventListener('click',function(){ pop.classList.contains('open')?closePop():openPop(); });

/* ---- Calendrier custom (charte ePackPro) : remplace le picker natif du navigateur ----
   Le popup natif de <input type="date"> n'est pas stylable (en-tete, fleches, boutons

   calendrier thematise (clair/sombre + FR/EN). Valeur ISO conservee dans dataset.iso. */
function calLoc(){ return isEN()?'en-US':'fr-FR'; }
function calIso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

    var first=new Date(y,m,1), dow=(first.getDay()+6)%7, startD=new Date(y,m,1-dow), cells='';
    for(var k=0;k<42;k++){ var d=new Date(startD); d.setDate(startD.getDate()+k);
      var cls='epp-cal-day'; if(d.getMonth()!==m) cls+=' oth'; if(d.getDay()===0||d.getDay()===6) cls+=' we';
      if(calSame(d,today)) cls+=' today'; if(calSame(d,sel)) cls+=' sel';
      cells+='<button type="button" class="'+cls+'" data-iso="'+calIso(d)+'">'+d.getDate()+'</button>';
    }
    pop.innerHTML='<div class="epp-cal-head">'+
        '<button type="button" class="epp-cal-nav" data-dir="-1" aria-label="'+(isEN()?'Previous month':'Mois précédent')+'"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>'+
        '<div class="epp-cal-title">'+title+'</div>'+
        '<button type="button" class="epp-cal-nav" data-dir="1" aria-label="'+(isEN()?'Next month':'Mois suivant')+'"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>'+
      '</div>'+
      '<div class="epp-cal-wds">'+wd+'</div>'+
      '<div class="epp-cal-grid">'+cells+'</div>'+
      '<div class="epp-cal-foot">'+
        '<button type="button" class="epp-cal-clear">'+(isEN()?'Clear':'Effacer')+'</button>'+
        '<button type="button" class="epp-cal-today">'+(isEN()?'Today':"Aujourd'hui")+'</button>'+
      '</div>';
  }
  function place(){ if(!cur) return; var r=cur.getBoundingClientRect(), vh=window.innerHeight, ph=pop.offsetHeight||330;
    var top=r.bottom+6; if(top+ph>vh-8) top=Math.max(8, r.top-6-ph); // bascule au-dessus si pas la place
    pop.style.left=Math.round(r.left)+'px'; pop.style.top=Math.round(top)+'px'; }
  function open(inp){ cur=inp; view=calParse(inp.dataset.iso)||new Date(); view=new Date(view.getFullYear(),view.getMonth(),1); draw(); pop.classList.add('open'); place(); }
  function close(){ pop.classList.remove('open'); cur=null; }
  function pick(isoStr){ if(cur){ cur.dataset.iso=isoStr; renderField(cur); try{ cur.dispatchEvent(new Event('change',{bubbles:true})); }catch(e){} } close(); }

  pop.addEventListener('mousedown',function(e){ e.preventDefault(); }); // garde le focus / evite la fermeture outside

    var nav=e.target.closest('.epp-cal-nav'); if(nav){ view=new Date(view.getFullYear(), view.getMonth()+parseInt(nav.dataset.dir,10), 1); draw(); return; }
    var day=e.target.closest('.epp-cal-day'); if(day){ pick(day.dataset.iso); return; }

    var wrap=document.createElement('span'); wrap.className='epp-datefield';
    inp.parentNode.insertBefore(wrap,inp); wrap.appendChild(inp);
    var btn=document.createElement('button'); btn.type='button'; btn.className='epp-cal-btn'; btn.setAttribute('aria-label','Calendrier');
    btn.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="17" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 9h18M8 2.5v4M16 2.5v4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';

  document.addEventListener('keydown',function(e){ if(e.key==='Escape' && cur) close(); });
  window.addEventListener('resize',function(){ if(cur) place(); });

  /* Re-localise l'affichage (format + calendrier ouvert) au changement de langue. */
  window.eppRefreshDates=function(){ inputs.forEach(renderField); if(cur) draw(); };
}

/* ---- Menus deroulants custom (charte ePackPro) : remplacent la liste native des <select> ----
   La liste d'options native d'un <select> n'est pas stylable (comme le picker de date). On garde
   le <select> (cache) comme source de verite (valeur + i18n des options) et on affiche un bouton

  var sels=[].slice.call(document.querySelectorAll('select.field')); if(!sels.length) return;

  function draw(sel){ pop.innerHTML=''; [].forEach.call(sel.options,function(o,i){
      var it=document.createElement('button'); it.type='button'; it.className='epp-sel-opt'+(i===sel.selectedIndex?' sel':'');
      it.textContent=o.textContent; it.dataset.idx=i; pop.appendChild(it); }); }

    var wrap=document.createElement('span'); wrap.className='epp-sel'; sel.parentNode.insertBefore(wrap,sel); wrap.appendChild(sel);
    var b=document.createElement('button'); b.type='button'; b.className='epp-sel-btn field';
    b.innerHTML='<span class="epp-sel-lbl"></span><svg class="epp-sel-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    wrap.appendChild(b); sel.__eppBtn=b; sel.style.display='none'; syncBtn(sel);

  window.addEventListener('resize',function(){ if(cur) place(cur); });

/* ---- Tooltip custom (charte ePackPro) : remplace le title natif ----
   Generique : tout élément avec data-epp-tip (HTML) affiche une bulle thematisee au survol.
   Delegation d'evenements -> marche aussi pour les lignes rendues dynamiquement. */
function wireTips(){
  var tip=document.createElement('div'); tip.className='epp-tip'; document.body.appendChild(tip); var cur=null;
  function place(el){ var r=el.getBoundingClientRect(), tw=tip.offsetWidth, th=tip.offsetHeight, vw=window.innerWidth;
    var left=r.left+r.width/2-tw/2; left=Math.max(8, Math.min(left, vw-tw-8));
    var top=r.top-th-9; if(top<8) top=r.bottom+9; // au-dessus si possible, sinon en dessous
    tip.style.left=Math.round(left)+'px'; tip.style.top=Math.round(top)+'px'; }
  function show(el){ var html=el.getAttribute('data-epp-tip'); if(!html) return; tip.innerHTML=html; cur=el; tip.classList.add('show'); place(el); }
  function hide(){ tip.classList.remove('show'); cur=null; }
  document.addEventListener('mouseover',function(e){ var el=e.target.closest('[data-epp-tip]'); if(el && el!==cur) show(el); });
  document.addEventListener('mouseout',function(e){ var el=e.target.closest('[data-epp-tip]'); if(el && (!e.relatedTarget || !el.contains(e.relatedTarget)) && !tip.contains(e.relatedTarget)) hide(); });
  document.addEventListener('focusin',function(e){ var el=e.target.closest('[data-epp-tip]'); if(el) show(el); });
  document.addEventListener('focusout',hide);
  window.addEventListener('scroll',function(){ if(cur) place(cur); },true);
  window.addEventListener('resize',function(){ if(cur) place(cur); });
}

/* ---- "Fit" : cale la largeur des blocs filtres/paginations sur la largeur reelle du tableau.
   Chaque .epp-fit prend min(largeur du tableau, place dispo). Appelable via window.eppSyncFits
   par les pages après (re)rendu/filtre/changement de langue. ---- */
function syncFits(){
  document.querySelectorAll('.epp-fit').forEach(function(fit){
    var tbl=fit.querySelector('table.tbl'); if(!tbl) return;
    fit.style.width=''; var avail=fit.parentElement.clientWidth;
    fit.style.width=Math.min(tbl.offsetWidth, avail)+'px';
  });

window.eppSyncFits=syncFits;

/* Cape la zone de contenu a la largeur du tableau le plus large (chrome inclus), aligne a gauche.
   Ne s'applique qu'aux pages contenant un table.tbl ; exclut les layouts speciaux
   (.prep-grid listes côte à côte, .qs-wrap recherche globale déjà dimensionnee). */
function fitContent(){
  var content=document.querySelector('.content'); if(!content) return;
  if(content.querySelector('.prep-grid')||content.querySelector('.qs-wrap')) return;
  if(!content.querySelector('table.tbl')) return;
  /* .content en max-content -> il se dimensionne au contenu le plus large (le tableau + son chrome).
     En dimensionnement intrinseque, les largeurs % des colonnes (col flex) sont traitees comme auto,
     donc le tableau ne "remplit" pas : on obtient sa vraie largeur (plancher min-width inclus). */
  content.style.maxWidth=''; content.style.width='max-content';
  var w=content.offsetWidth;
  content.style.width='';
  if(w>0) content.style.maxWidth=w+'px';
  content.style.marginRight='auto';        // garde l'alignement a gauche
}
window.eppFitContent=fitContent;

/* ---- Demarrage ---- */
function start(){
  var app=document.getElementById('app');

  if(app){ app.classList.add('no-anim'); try{ if(localStorage.getItem('eppSideCollapsed')==='1') app.classList.add('sb'); }catch(e){} }

  document.documentElement.classList.remove('epp-sb-pre'); // l'état passe desormais par .app.sb
  if(app) setTimeout(function(){ app.classList.remove('no-anim'); }, 60);
}

function el(tag, props, kids){

    if(k==='class') e.className=props[k];

    else if(k==='text') e.textContent=props[k];

/* Parse un OptionsUI.xml (config V5) -> liste ordonnee de modules {name, key, pos}. */
function parseOptionsUI(xmlText){

function moduleGrid(mods, editable){
  var g=el('div',{class:'mod-grid'});
  var shown=0;
  (mods||[]).forEach(function(m,i){
    if(!m.name && !editable) return; shown++;
    var tile=el('div',{class:'mod-tile '+(m.variable?'var':'type')+(editable?' editable':''),
      title: editable ? t('Cliquer pour basculer Type / Variable','Click to toggle Type / Variable') : ''});
    tile.innerHTML='<div class="mt-top"><span class="mt-ord">'+(i+1)+'</span><span class="mt-name">'+esc(m.name||'-')+'</span></div>'+
      '<span class="mt-flag">'+(m.variable?t('Variable','Variable'):t('Type','Type'))+'</span>';
    if(editable) tile.addEventListener('click',function(){ m.variable=!m.variable; touch(); renderEditor($content()); });
    g.appendChild(tile);
  });
  if(!shown) return el('div',{class:'empty-note',text:t('Aucun module. Importe un OptionsUI.xml.','No module yet. Import an OptionsUI.xml.')});
  return g;
}

/* Construit une image SVG (autonome, palette claire fixe) de la grille 4/ligne. */
function buildModulesSvg(acc, modsIn, zoneLabel){
  var mods=(modsIn||acc.tech.modules||[]).filter(function(m){ return m.name; });
  var cols=4, tw=250, th=76, gap=14, padX=26, padTop=96, padBot=26;
  var rows=Math.max(1, Math.ceil(mods.length/cols));
  var W=padX*2 + cols*tw + (cols-1)*gap;
  var H=padTop + rows*th + (rows-1)*gap + padBot;
  function xesc(s){ return esc(s); }
  function wrap(name){ // 2 lignes max, ~26 caracteres/ligne
    var words=String(name).split(/\s+/), lines=[], cur='';
    words.forEach(function(w){ if((cur+' '+w).trim().length>26){ if(cur) lines.push(cur); cur=w; } else cur=(cur?cur+' ':'')+w; });
    if(cur) lines.push(cur);
    if(lines.length>2){ lines=[lines[0], lines.slice(1).join(' ')]; if(lines[1].length>26) lines[1]=lines[1].slice(0,25)+'…'; }
    return lines;
  }
  var tiles='';
  mods.forEach(function(m,i){
    var r=Math.floor(i/cols), c=i%cols;
    var x=padX + c*(tw+gap), y=padTop + r*(th+gap);
    var isVar=!!m.variable;
    var fill=isVar?'#fdeee4':'#eef3f1', stroke=isVar?'#F96C1E':'#305754';
    var flagBg=isVar?'#F96C1E':'#305754';
    var flag=isVar?(EN()?'VARIABLE':'VARIABLE'):(EN()?'TYPE':'TYPE');
    var lines=wrap(m.name);
    var nameSvg=lines.map(function(ln,li){ return '<text x="'+(x+44)+'" y="'+(y+26+li*16)+'" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#24403d">'+xesc(ln)+'</text>'; }).join('');
    var flagW=isVar?70:44;
    tiles+='<rect x="'+x+'" y="'+y+'" width="'+tw+'" height="'+th+'" rx="11" fill="'+fill+'" stroke="'+stroke+'" stroke-width="1.5"/>'+
      '<rect x="'+(x+12)+'" y="'+(y+13)+'" width="24" height="24" rx="6" fill="#ffffff" stroke="#d2ddd8"/>'+
      '<text x="'+(x+24)+'" y="'+(y+29)+'" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#657d7a">'+(i+1)+'</text>'+
      nameSvg+
      '<rect x="'+(x+44)+'" y="'+(y+th-24)+'" width="'+flagW+'" height="16" rx="8" fill="'+flagBg+'"/>'+
      '<text x="'+(x+44+flagW/2)+'" y="'+(y+th-12)+'" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="9" font-weight="800" fill="#ffffff" letter-spacing="0.5">'+flag+'</text>';
  });
  var title=xesc((acc.group.name||t('Grand Compte','Key account'))+(zoneLabel?(' - '+zoneLabel):''));
  var sub=xesc(t('Modules du paramétrage type','Param type modules')+' - '+mods.length+' '+t('module(s)','module(s)'));
  var svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">'+
    '<rect width="'+W+'" height="'+H+'" fill="#ffffff"/>'+
    '<text x="'+padX+'" y="40" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#305754">'+title+'</text>'+
    '<text x="'+padX+'" y="62" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#657d7a">'+sub+'</text>'+
    '<rect x="'+padX+'" y="74" width="13" height="13" rx="3" fill="#eef3f1" stroke="#305754"/>'+
    '<text x="'+(padX+20)+'" y="85" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#657d7a">Type</text>'+
    '<rect x="'+(padX+70)+'" y="74" width="13" height="13" rx="3" fill="#fdeee4" stroke="#F96C1E"/>'+
    '<text x="'+(padX+90)+'" y="85" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#657d7a">Variable</text>'+
    tiles+'</svg>';
  return svg;
}
function exportModulesPng(acc, modsIn, zoneLabel){
  var mods=(modsIn||acc.tech.modules||[]).filter(function(m){ return m.name; });
  if(!mods.length){ eppFlash(t('Aucun module à exporter. Importe un OptionsUI.xml.','No module to export. Import an OptionsUI.xml.'),{type:'warn',timeout:2600}); return; }
  var svg=buildModulesSvg(acc, mods, zoneLabel);
  var url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml;charset=utf-8'}));
  var img=new Image();
  img.onload=function(){
    var scale=2, c=el('canvas'); c.width=img.width*scale; c.height=img.height*scale;
    var ctx=c.getContext('2d'); ctx.scale(scale,scale); ctx.drawImage(img,0,0); URL.revokeObjectURL(url);
    try{
      c.toBlob(function(png){ if(!png){ eppFlash(t('Export image impossible.','Image export failed.'),{type:'err',timeout:2600}); return; }
        var u=URL.createObjectURL(png); var a=el('a',{href:u,download:'modules-'+slug(acc.group.name)+(zoneLabel?('-'+slug(zoneLabel)):'')+'.png'});
        document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(u); },1000);
        eppFlash(t('Image des modules exportée (PNG).','Modules image exported (PNG).'),{type:'ok',timeout:2200});
      },'image/png');
    }catch(e){ eppFlash(t('Export image impossible.','Image export failed.'),{type:'err',timeout:2600}); }
  };
  img.onerror=function(){ URL.revokeObjectURL(url); eppFlash(t('Export image impossible.','Image export failed.'),{type:'err',timeout:2600}); };
  img.src=url;
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function slug(s){ return (String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''))||'grand-compte'; }
function firstLetter(name){ var s=String(name||'').trim().normalize('NFD').replace(/[̀-ͯ]/g,''); var m=s.match(/[A-Za-z]/); return m?m[0].toUpperCase():'#'; }
/* Comparaison de noms tolerante (ordre nom/prenom, accents, ponctuation). */
function nameKey(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim().split(/\s+/).filter(Boolean).sort().join(' '); }
function nameMatch(a,b){ var ka=nameKey(a),kb=nameKey(b); return !!ka&&ka===kb; }
/* Normalise une valeur en liste de noms (gere l'ancien format chaine). */
function asList(v){ return Array.isArray(v)?v.filter(function(x){return x&&String(x).trim();}):((v&&String(v).trim())?[v]:[]); }
function listMatch(arr,name){ return asList(arr).some(function(x){ return nameMatch(x,name); }); }
/* --- Recalage des noms CSM / QM sur les noms officiels (corrige les fiches d'exemple
   et les anciennes saisies : ordre inverse, prenom seul, combos "A / B", noms retires). --- */
function nameWords(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim().split(/\s+/).filter(Boolean); }
function wordsSubset(a,b){ return a.length>0 && a.every(function(w){ return b.indexOf(w)>=0; }); }
function canonEntry(name){ return { name:name, words:nameWords(name) }; }
var CSM_CANON=['Guillaume TAVERNIERS','Lauriane GOUISSEM','Cynthia LOBET','Marie VERDIER','Gerda MEVEL-DE BACKER'].map(canonEntry);
var QM_CANON=['Sylvain HAMELIN','Nathan LAFFEZ','Marion LE STANG','Alexandre DELATOUCHE','Fayçal KHIRI','Jocelyne FOLLY-KLAN','Lucie DAURY'].map(canonEntry);
var RETIRED_CANON=['Morgane BEGARD'].map(canonEntry); // personnes retirees -> supprimees
function canonPerson(piece, kind){
  var pw=nameWords(piece);
  if(!pw.length) return '';
  var hasSig=pw.some(function(w){ return w.length>=3; }); // evite un match sur "de", "le"...
  if(!hasSig) return piece;
  if(RETIRED_CANON.some(function(o){ return wordsSubset(pw,o.words); })) return null; // drop
  var pools = kind==='qm' ? [QM_CANON,CSM_CANON] : [CSM_CANON,QM_CANON];
  for(var p=0;p<pools.length;p++){
    for(var i=0;i<pools[p].length;i++){ if(wordsSubset(pw, pools[p][i].words)) return pools[p][i].name; }
  }
  return piece; // inconnu : on garde tel quel
}
function canonTeam(raw, kind){
  var out=[];
  asList(raw).forEach(function(v){
    String(v).split(/[\/,;]+/).forEach(function(p){
      var r=canonPerson(p.trim(), kind);
      if(r===null || r==='') return;
      if(out.indexOf(r)<0) out.push(r);
    });
  });
  return out;
}

/* Liste consolidee des comptes manager : contacts siege flagges + comptes hors contacts. */
function allManagerAccounts(acc){
  var out=[];
  (acc.contacts||[]).forEach(function(c){ if(c.account){ var nm=((c.firstName||'')+' '+(c.lastName||'')).trim(); out.push({name:nm||(c.email||'-'), email:c.email||'', type:c.account, source:'contact', zone:asList(c.scope).join(', ')}); } });

  return out;
}
/* Regle : 1 Super Admin par zone. Alerte si une meme zone en a plusieurs. */
function superAdminIssue(acc){
  var byZone={};
  allManagerAccounts(acc).forEach(function(a){ if(a.type==='super'){ var z=(a.zone||'').toLowerCase(); byZone[z]=(byZone[z]||0)+1; } });
  for(var k in byZone){ if(byZone[k]>1) return true; }
  return false;
}

/* Une étape est-elle "remplie" (pour la coche de progression) ? */
function stepFilled(i){
  if(!CUR) return false;
  var g=CUR.group;
  switch(i){
    case 0: return !!(g.name&&g.name.trim());
    case 1: return CUR.contacts.some(function(c){ return c.lastName||c.firstName||c.email||c.phone; });
    case 2: var n=CUR.internal; return !!(asList(n.qm).length||asList(n.csm).length||n.others.length);
    case 3: var c=CUR.commercial; return !!(c.frameContract||c.priceRef||c.prices.length||c.consumables.length||c.consumableNote||c.history);
    case 4: var d=CUR.deploy; return !!(d.sitesEquipped||d.sitesToEquip||d.cadence||d.planningUrl||d.refSite);
    case 5: var te=CUR.tech; var zmN=0; if(te.zoneModules) for(var zk in te.zoneModules){ zmN+=(te.zoneModules[zk]||[]).length; } return !!(te.paramTypeUrl||(te.modules&&te.modules.length)||zmN||(te.managerAccounts&&te.managerAccounts.length)||te.updateAccount||te.listingUrl||te.vigilance.length||te.note);
  }
  return false;
}
function progress(acc){ var n=0; var save2=CUR; CUR=acc; for(var i=0;i<=LAST_FORM;i++) if(stepFilled(i)) n++; CUR=save2; return n; }

function adjustTopBtn(){

    if(foot && getComputedStyle(foot).position==='sticky' && foot.offsetParent!==null){

function touch(){ CUR.updatedAt=Date.now(); if(CUR._seed) CUR._seed=false; save(); }

/* ---------- Historique des modifications (par section) ---------- */
var SNAP=null;
var HIST_SECTIONS=['group','contacts','internal','commercial','deploy','tech'];
var SECTION_LABELS={group:['Le groupe','The group'],contacts:['Contacts siège','HQ contacts'],internal:['Notre équipe','Our team'],commercial:['Commercial','Commercial'],deploy:['Déploiement','Rollout'],tech:['Technique & paramétrages','Technical & setup']};
function sectionData(a){ var o={}; HIST_SECTIONS.forEach(function(k){ o[k]=JSON.stringify(a[k]); }); return o; }
function snapshot(){ SNAP = CUR ? sectionData(CUR) : null; }
function currentUserLabel(){ return USER.name || (USER.role&&USER.role!=='all'?ROLE_LABEL[USER.role]:'') || t('(non identifié)','(unidentified)'); }
function pushHistory(action, sections){ if(!CUR) return; if(!Array.isArray(CUR.history)) CUR.history=[]; CUR.history.push({ts:Date.now(), user:currentUserLabel(), action:action, sections:sections||[]}); }
/* ---- Verrouillage d'une fiche (pose par un CSM quand il la juge complete) ---- */
function isLocked(a){ return !!(a && a.locked); }
function canToggleLock(){ return USER.role==='csm'; }  // seuls les CSM verrouillent / deverrouillent
function lockFiche(a){ if(!a) return; a.locked=true; a.lockedBy=currentUserLabel(); a.lockedAt=Date.now(); a._seed=false;
  if(CUR===a){ pushHistory('lock'); } save(); }
function unlockFiche(a){ if(!a) return; a.locked=false; a.lockedBy=''; a.lockedAt=0;
  if(CUR===a){ pushHistory('unlock'); } save(); }
function logSave(){
  if(!CUR){ return; }
  if(!SNAP){ snapshot(); return; }
  var cur=sectionData(CUR), changed=[];
  HIST_SECTIONS.forEach(function(k){ if(cur[k]!==SNAP[k]) changed.push(k); });
  if(changed.length){ pushHistory('modify', changed); SNAP=cur; CUR.updatedAt=Date.now(); save(); }
}

/* Menu deroulant a choix multiples (cases a cocher). sel = tableau de noms. */
function multiPick(sel, list, onChange, ph){
  sel=asList(sel);
  var wrap=el('div',{class:'mpick'});
  var btn=el('button',{type:'button',class:'mpick-btn field'});
  var panel=el('div',{class:'mpick-panel',style:'display:none;'});
  // Positionne le panneau en coordonnees viewport (position:fixed) pour passer AU-DESSUS des cartes
  // (echappe a tout overflow:hidden des conteneurs parents).
  function place(){
    var r=btn.getBoundingClientRect();
    var vh=window.innerHeight||document.documentElement.clientHeight;
    var below=vh-r.bottom, above=r.top;
    var maxH=Math.min(260, Math.max(below,above)-10);
    panel.style.width=r.width+'px';
    panel.style.left=r.left+'px';
    panel.style.maxHeight=maxH+'px';
    if(below>=Math.min(260,above) || below>200){ panel.style.top=(r.bottom+4)+'px'; panel.style.bottom='auto'; }
    else { panel.style.top='auto'; panel.style.bottom=(vh-r.top+4)+'px'; }
  }
  function onWin(){ if(panel.style.display!=='none') place(); }
  function closeOut(ev){ if(!wrap.contains(ev.target)){ closePanel(); } }
  function closePanel(){ panel.style.display='none'; document.removeEventListener('mousedown',closeOut); window.removeEventListener('scroll',onWin,true); window.removeEventListener('resize',onWin); }
  function drawBtn(){
    btn.innerHTML='';
    if(sel.length){
      var chips=el('span',{class:'mpick-chips'});
      sel.forEach(function(name){
        var c=el('span',{class:'mpick-chip'});
        c.appendChild(el('span',{text:name}));
        var x=el('span',{class:'mpick-x',title:t('Retirer','Remove'),text:'×'});
        x.addEventListener('mousedown',function(ev){ ev.stopPropagation(); ev.preventDefault(); sel=sel.filter(function(n){return n!==name;}); onChange(sel.slice()); drawBtn(); drawPanel(); });
        c.appendChild(x);
        chips.appendChild(c);
      });
      btn.appendChild(chips);
    } else {
      btn.appendChild(el('span',{class:'mpick-ph',text:ph||t('Choisir...','Select...')}));
    }
    btn.appendChild(el('span',{class:'mpick-chev',html:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>'}));
  }
  function drawPanel(){
    panel.innerHTML='';
    list.forEach(function(name){
      var on=sel.indexOf(name)>=0;
      var row=el('label',{class:'mpick-opt'+(on?' on':'')});
      var cb=el('input',{type:'checkbox'}); cb.checked=on;
      cb.addEventListener('change',function(){
        if(cb.checked){ if(sel.indexOf(name)<0) sel.push(name); }
        else sel=sel.filter(function(n){return n!==name;});
        onChange(sel.slice()); drawBtn(); drawPanel();
      });
      row.appendChild(cb); row.appendChild(el('span',{text:name}));
      panel.appendChild(row);
    });
    if(panel.style.display!=='none') place();
  }
  btn.addEventListener('mousedown',function(ev){
    ev.preventDefault();
    var open=panel.style.display!=='none';
    if(open){ closePanel(); }
    else { panel.style.display='block'; drawPanel(); place();
      setTimeout(function(){ document.addEventListener('mousedown',closeOut); window.addEventListener('scroll',onWin,true); window.addEventListener('resize',onWin); },0); }
  });
  drawBtn();
  wrap.appendChild(btn); wrap.appendChild(panel);
  // Re-synchronise l'affichage depuis l'exterieur, sans re-render global (garde le menu ouvert).
  wrap.__set=function(arr){ sel=asList(arr); drawBtn(); if(panel.style.display!=='none') drawPanel(); };
  return wrap;
}

function lockDisable(root){
  root.classList.add('is-locked');
  root.querySelectorAll('input,select,textarea,button').forEach(function(e){ e.disabled=true; });
  root.querySelectorAll('.epp-switch,.mpick-btn,.yn-ctl,.id-pick,.spec-wrap').forEach(function(e){ e.style.pointerEvents='none'; });
}

function wizFoot(){
  var foot=el('div',{class:'wiz-foot'});
  var prev=el('button',{class:'btn btn-ghost',onclick:function(){ if(STEP>0) gotoStep(STEP-1); else goHome(); }});
  prev.innerHTML='<svg class="ico sm" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>'+(STEP>0?t('Précédent','Previous'):t('Liste','List'));
  foot.appendChild(prev);
  foot.appendChild(el('span',{class:'wiz-progress',text:t('Étape','Step')+' '+(STEP+1)+' / 6'}));
  foot.appendChild(el('span',{class:'spacer'}));

  var locked=isLocked(CUR);
  if(!locked){
    var bSave=el('button',{class:'btn btn-save',onclick:function(){ logSave(); eppFlash(t('Fiche enregistrée','Sheet saved'),{type:'ok',timeout:1800}); }});
    bSave.innerHTML='<svg class="ico sm" viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7"/></svg>'+t('Enregistrer','Save');
    foot.appendChild(bSave);
    if(canToggleLock()){
      var bLock=el('button',{class:'btn btn-danger',title:t('Verrouiller quand la fiche est complète','Lock when the sheet is complete'),
        onclick:function(){ lockFiche(CUR); renderAll(); eppFlash(t('Fiche verrouillée','Sheet locked'),{type:'ok',timeout:1600}); }});
      bLock.innerHTML='<svg class="ico sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>'+t('Verrouiller','Lock');
      foot.appendChild(bLock);
    }
  }

  if(STEP<LAST_FORM){
    var next=el('button',{class:'btn btn-brand',onclick:function(){ if(!isLocked(CUR)) touch(); gotoStep(STEP+1); }});
    next.innerHTML=t('Suivant','Next')+'<svg class="ico sm" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>';
    foot.appendChild(next);
  } else {
    var fin=el('button',{class:'btn btn-view',onclick:function(){ if(!isLocked(CUR)) touch(); gotoStep(6); }});
    fin.innerHTML=t('Voir la fiche','View sheet')+'<svg class="ico sm" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>';
    foot.appendChild(fin);
  }
  return foot;
}

/* ----- Étape 1 : le groupe ----- */
function stepGroup(box){
  var g=CUR.group;
  box.appendChild(el('p',{class:'step-intro',text:t(
    "Identité du groupe : son nom, ses marques, son périmètre géographique, et le traitement filiales / franchises.",
    "Group identity: its name, brands, geographic scope, and how subsidiaries / franchises are handled.")}));

  box.appendChild(field('Nom du groupe','Group name',
    inputText(g.name,function(v){ g.name=v; touch(); }, t('Ex. Groupe Martin','e.g. Martin Group')), {req:true}));

  // Code SFA (Salesforce) + bouton d'ouverture du compte Salesforce
  var sfaInp=inputText(g.sfa,function(v){ g.sfa=v; touch(); }, 'Ex. SFA004891'); sfaInp.style.flex='1 1 auto';
  var sfaCtl=el('div',{style:'display:flex;gap:8px;align-items:center;'});
  var sfBtn=el('a',{class:'btn btn-view sf-open',target:'_blank',rel:'noopener',title:t('Ouvrir le compte dans Salesforce','Open the account in Salesforce')});
  sfBtn.innerHTML='<svg class="ico sm" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M19 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h6"/></svg>Salesforce';
  function syncSf(){ if(g.sfLink){ sfBtn.href=g.sfLink; sfBtn.style.display=''; } else sfBtn.style.display='none'; }
  syncSf();
  sfaCtl.appendChild(sfaInp); sfaCtl.appendChild(sfBtn);
  box.appendChild(field('Code SFA (Salesforce)','SFA code (Salesforce)', sfaCtl,
    {hint:['Identifiant du compte Groupement dans Salesforce. Le bouton ouvre le compte.','Groupement account id in Salesforce. The button opens the account.']}));
  box.appendChild(field('Lien Salesforce','Salesforce link',
    inputText(g.sfLink,function(v){ g.sfLink=v; syncSf(); touch(); }, 'https://chr-numerique.lightning.force.com/...'), {col2:true}));

  box.appendChild(ynRow('Le groupe possede-t-il plusieurs marques ?','Does the group own several brands?',
    null,null, g.multiBrand, function(v){ g.multiBrand=v; touch(); renderEditor($content()); }));

    var rb=el('div',{class:'reveal'});
    rb.appendChild(el('div',{class:'fld-lbl',text:t('Marques du groupe','Group brands')}));
    rb.appendChild(textList(g.brands,'Nom de la marque','Brand name','Ajouter une marque','Add a brand'));
    box.appendChild(rb);

  box.appendChild(ynRow('Multi-zones / multi-pays ?','Multi-zone / multi-country?',
    'Le groupe est-il présent sur plusieurs zones ou pays ?','Is the group present in several zones or countries?',
    g.multiZone, function(v){ g.multiZone=v; touch(); renderEditor($content()); }));
  if(g.multiZone){
    var rz=el('div',{class:'reveal'});
    rz.appendChild(el('div',{class:'fld-lbl',text:t('Zones / pays concernes','Zones / countries')}));
    rz.appendChild(textList(g.zones,'Ex. France, Espagne, Maroc...','e.g. France, Spain, Morocco...','Ajouter une zone / pays','Add a zone / country'));
    box.appendChild(rz);
  }

  box.appendChild(ynRow('Filiales et franchises traitées pareil ?','Subsidiaries and franchises handled the same?',
    'Même fonctionnement côté Technique pour les filiales et les franchises ?','Same technical handling for subsidiaries and franchises?',
    g.sfSame, function(v){ g.sfSame=v; touch(); renderEditor($content()); }));
  if(!g.sfSame){
    var rs=el('div',{class:'reveal'});
    rs.appendChild(field('Préciser les différences','Describe the differences',
      textarea(g.sfDiff,function(v){ g.sfDiff=v; touch(); },
        t('Ex. les franchises passent par le Support Grands Comptes, les filiales par la Production...',
          'e.g. franchises go through Key Accounts Support, subsidiaries through Production...')), {col2:true}));
    box.appendChild(rs);

/* ----- Étape 2 : contacts siege ----- */
function stepContacts(box){
  box.appendChild(el('p',{class:'step-intro',text:t(
    "Les interlocuteurs côté client (siège). Tu peux en ajouter plusieurs. En multi-zones, précise le périmètre de chaque contact (même contact pour tout, ou un par zone / type).",
    "Client-side contacts (HQ). You can add several. For multi-zone groups, specify each contact's scope (same contact for all, or one per zone / type).")}));
  var wrap=el('div',{class:'rep'});
  function redraw(){
    wrap.innerHTML='';
    CUR.contacts.forEach(function(ct,i){
      var card=el('div',{class:'rep-card'});
      var head=el('div',{class:'rep-head'});
      head.appendChild(el('span',{class:'rep-title',text:t('Contact','Contact')+' '+(i+1)}));
      if(ct.account) head.appendChild(el('span',{class:'chip mod-req',style:'margin-left:4px;',text:acctLabel(ct.account)}));
      var tools=el('div',{class:'rep-tools'});
      if(CUR.contacts.length>1){
        var del=el('button',{class:'iconbtn-sm danger',title:t('Retirer','Remove'),onclick:function(){ CUR.contacts.splice(i,1); touch(); redraw(); }});
        del.innerHTML='<svg class="ico sm" viewBox="0 0 24 24"><path d="M5 12h14"/></svg>'; tools.appendChild(del);
      }
      head.appendChild(tools); card.appendChild(head);
      var grid=el('div',{class:'form-grid'});
      grid.appendChild(field('Prenom','First name', inputText(ct.firstName,function(v){ ct.firstName=v; touch(); })));
      grid.appendChild(field('Nom','Last name', inputText(ct.lastName,function(v){ ct.lastName=v; touch(); })));
      grid.appendChild(field('Poste / titre','Position / title', inputText(ct.role,function(v){ ct.role=v; touch(); }, t('Ex. Directeur IT','e.g. IT Director'))));
      grid.appendChild(field('Email','Email', inputText(ct.email,function(v){ ct.email=v; touch(); })));
      grid.appendChild(field('Téléphone','Phone', inputText(ct.phone,function(v){ ct.phone=v; touch(); })));
      if(CUR.group.multiZone){
        var TOUT=t('Tout','All');
        ct.scope=asList(ct.scope);
        var zones=(CUR.group.zones||[]).filter(Boolean);
        var scopeOpts=[TOUT].concat(zones);
        var scopePick=multiPick(ct.scope.length?ct.scope:[TOUT], scopeOpts, function(v){
          // Exclusivite : "Tout" efface les zones ; choisir une zone efface "Tout".
          var last=v[v.length-1], before=v.length;
          if(last===TOUT) v=[TOUT];
          else v=v.filter(function(x){ return x!==TOUT; });
          ct.scope=v; touch();
          if(v.length!==before) scopePick.__set(v); // reflete l'exclusivite sans fermer le menu
        }, TOUT);
        grid.appendChild(field('Périmètre (zone / type)','Scope (zone / type)', scopePick,
          {hint:['En multi-zones : "Tout" ou une/plusieurs zones definies à l\'étape Le groupe.','Multi-zone: "All" or one/several zones defined in the Group step.']}));
      }
      grid.appendChild(field('Compte ePack Manager','ePack Manager account',
        selectField(acctOptions(true), ct.account||'', function(v){ ct.account=v; touch();
          if(v==='super' && superAdminIssue(CUR)) eppFlash(t('Attention : un seul Super Admin par zone.','Warning: only one Super Admin per zone.'),{type:'warn',timeout:3200});
          redraw(); }),
        {hint:['Si ce contact a un compte ePack Manager, choisis son type (évite de le re-saisir côté Technique).','If this contact has an ePack Manager account, pick its type (avoids re-entering it on the Technical step).']}));
      card.appendChild(grid);
      wrap.appendChild(card);
    });
    var add=el('button',{class:'btn btn-ghost rep-add',onclick:function(){ CUR.contacts.push(blankContact()); touch(); redraw(); }});
    add.innerHTML='<svg class="ico sm" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>'+t('Ajouter un contact','Add a contact');
    wrap.appendChild(add);
  }
  redraw(); box.appendChild(wrap);
}

/* ----- Étape 3 : notre équipe (interne) ----- */
function stepTeam(box){
  var n=CUR.internal;
  box.appendChild(el('p',{class:'step-intro',text:t(
    "Qui est qui chez nous sur ce compte. Les rôles clés d'abord, puis tout autre interlocuteur interne utile.",
    "Who is who on our side for this account. Key roles first, then any other useful internal contact.")}));
  n.csm=asList(n.csm); n.qm=asList(n.qm);
  var grid=el('div',{class:'form-grid'});
  // QM d'abord construit pour pouvoir le rafraichir quand un CSM est choisi.
  var qmPick=multiPick(n.qm, QM_LIST, function(v){ n.qm=v; touch(); },
      t('Choisir un ou plusieurs QM...','Select one or more QM...'));
  // CSM : choix multiple. Chaque CSM choisi ajoute son QM attitre a la liste QM.
  grid.appendChild(field('CSM','CSM',
    multiPick(n.csm, CSM_LIST, function(v){
      n.csm=v;
      // auto-ajout du QM attitre pour chaque CSM sélectionné (sans retirer les QM déjà la)
      var added=false;
      v.forEach(function(name){ var q=CSM_QM[name]; if(q && n.qm.indexOf(q)<0){ n.qm.push(q); added=true; } });
      touch();
      if(added) qmPick.__set(n.qm); // rafraichit juste le champ QM, garde le menu CSM ouvert
    }, t('Choisir un ou plusieurs CSM...','Select one or more CSM...')),
    {role:'csm', hint:['Choix multiple. Marie VERDIER : Club Med et quelques groupes étrangers. Gerda MEVEL-DE BACKER : BENELUX / distributeurs (Suisse, DROM-TOM).',
           'Multi-select. Marie VERDIER: Club Med and a few foreign groups. Gerda MEVEL-DE BACKER: BENELUX / distributors (Switzerland, DROM-TOM).']}));
  grid.appendChild(field('QM','QM', qmPick,
    {role:'qm', hint:['Choix multiple. Le QM attitré est pré-ajouté selon le CSM (modifiable).',
           'Multi-select. The assigned QM is pre-added from the CSM (editable).']}));
  box.appendChild(grid);

  box.appendChild(el('div',{class:'sub-h',text:t('Autres interlocuteurs internes','Other internal contacts')}));
  var wrap=el('div',{class:'rep'});
  function redraw(){
    wrap.innerHTML='';
    if(!n.others.length) wrap.appendChild(el('div',{class:'empty-note',text:t('Aucun autre interlocuteur ajouté.','No other contact added.')}));
    n.others.forEach(function(o,i){
      var line=el('div',{class:'rep-line'});
      line.appendChild(inputText(o.role,function(v){ o.role=v; touch(); }, t('Rôle / service','Role / team')));
      line.appendChild(inputText(o.name,function(v){ o.name=v; touch(); }, t('Nom','Name')));
      var del=el('button',{class:'iconbtn-sm danger',title:t('Retirer','Remove'),onclick:function(){ n.others.splice(i,1); touch(); redraw(); }});
      del.innerHTML='<svg class="ico sm" viewBox="0 0 24 24"><path d="M5 12h14"/></svg>'; line.appendChild(del);
      wrap.appendChild(line);
    });
    var add=el('button',{class:'btn btn-ghost rep-add',onclick:function(){ n.others.push({role:'',name:''}); touch(); redraw(); }});
    add.innerHTML='<svg class="ico sm" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>'+t('Ajouter un interlocuteur','Add a contact');
    wrap.appendChild(add);
  }
  redraw(); box.appendChild(wrap);
}

function priceTable(arr, withCat){
  var wrap=el('div',{class:'rep'});
  var catOpts=[
    {v:'matériel',l:t('Matériel','Hardware')},
    {v:'option',l:t('Option','Option')},
    {v:'accessoire',l:t('Accessoire','Accessory')}
  ];
  function redraw(){
    wrap.innerHTML='';
    if(!arr.length) wrap.appendChild(el('div',{class:'empty-note',text:t('Aucune ligne. Ajoute un tarif négocié ci-dessous.','No line yet. Add a negotiated price below.')}));
    arr.forEach(function(p,i){
      var card=el('div',{class:'rep-card'});
      var grid=el('div',{class:'form-grid'});
      if(withCat) grid.appendChild(field('Catégorie','Category', selectField(catOpts, p.cat||'matériel', function(v){ p.cat=v; touch(); })));
      grid.appendChild(field('Désignation','Item', inputText(p.label,function(v){ p.label=v; touch(); }, t('Ex. Terminal X, option Y','e.g. Terminal X, option Y'))));
      grid.appendChild(field('Tarif négocié','Negotiated price', inputText(p.price,function(v){ p.price=v; touch(); }, t('Ex. 1 290 EUR','e.g. EUR 1,290'))));
      grid.appendChild(field('Remarque','Note', inputText(p.note,function(v){ p.note=v; touch(); })));
      card.appendChild(grid);
      var tools=el('div',{style:'display:flex;justify-content:flex-end;margin-top:8px;'});
      var del=el('button',{class:'iconbtn-sm danger',title:t('Retirer','Remove'),onclick:function(){ arr.splice(i,1); touch(); redraw(); }});
      del.innerHTML='<svg class="ico sm" viewBox="0 0 24 24"><path d="M5 12h14"/></svg>'; tools.appendChild(del);
      card.appendChild(tools);
      wrap.appendChild(card);
    });
    var add=el('button',{class:'btn btn-ghost rep-add',onclick:function(){ arr.push(withCat?{cat:'matériel',label:'',price:'',note:''}:{label:'',price:'',note:''}); touch(); redraw(); }});
    add.innerHTML='<svg class="ico sm" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>'+(withCat?t('Ajouter un tarif','Add a price'):t('Ajouter un consommable','Add a consumable'));
    wrap.appendChild(add);
  }
  redraw(); return wrap;
}

/* ----- Étape 6 : technique & paramétrages ----- */
function stepTech(box){
  var te=CUR.tech;
  box.appendChild(el('p',{class:'step-intro',text:t(
    "Infos TECHNIQUES spécifiques à ce groupe (pour la Production/SAV). La procédure standard (Windows, convention de nommage Teamviewer/ePack Manager, étapes d'intégration) reste dans Documize : ici on ne note que ce qui est propre au groupe.",
    "GROUP-SPECIFIC technical info (for Production/SAV). The standard procedure (Windows, Teamviewer/ePack Manager naming, integration steps) stays in Documize: here we only capture what is specific to the group.")}));

  // --- Paramétrage type ---
  box.appendChild(el('div',{class:'sub-h',text:t('Paramétrage type','Standard setup / param type')}));
  var pg=el('div',{class:'form-grid'});
  pg.appendChild(field('Lien du paramétrage type (SharePoint)','Param type link (SharePoint)',
    inputText(te.paramTypeUrl,function(v){ te.paramTypeUrl=v; touch(); }, t('Lien vers le dossier PARAMS TYPES du groupe','Link to the group PARAMS TYPES folder')),
    {col2:true}));
  pg.appendChild(field('Langue(s) du paramétrage','Param language(s)',
    inputText(te.paramLangs,function(v){ te.paramLangs=v; touch(); }, t('Ex. FR, EN, ES','e.g. FR, EN, ES'))));
  box.appendChild(pg);

  // --- Modules (ordre + noms), importables depuis OptionsUI.xml ---
  box.appendChild(el('div',{class:'sub-h',text:t('Modules (paramétrage type)','Modules (param type)')}));

  var zones=(CUR.group.zones||[]).filter(Boolean);
  var perZone=CUR.group.multiZone && zones.length>0;
  if(perZone){
    if(te.moduleScope!=='zone') te.moduleScope='common';
    var chooser=el('div',{class:'seg-choice'});
    [['common',t('Commun à toutes les zones','Common to all zones')],['zone',t('Par zone','Per zone')]].forEach(function(o){
      chooser.appendChild(el('button',{type:'button',class:'seg-btn'+(te.moduleScope===o[0]?' on':''),text:o[1],
        onclick:function(){ te.moduleScope=o[0]; touch(); renderEditor($content()); }}));
    });
    box.appendChild(chooser);
    box.appendChild(el('p',{class:'fld-hint',style:'margin:2px 0 12px;',
      text:t('"Par zone" : un paramétrage type (OptionsUI.xml) et ses modules propres à chaque zone. Sinon, un seul jeu commun à toutes les zones.',
             '"Per zone": one param type (OptionsUI.xml) and its own modules per zone. Otherwise, a single set shared by all zones.')}));
  }

  // Import d'un OptionsUI.xml dans un tableau de modules (get/set), en gardant les choix Type/Variable connus.
  function importOptionsUIInto(getMods, setMods){
    var inp=el('input',{type:'file',accept:'.xml,text/xml,application/xml',style:'display:none;'});
    inp.addEventListener('change',function(){ var f=inp.files&&inp.files[0]; if(!f) return;
      var r=new FileReader();
      r.onload=function(){
        var mods=parseOptionsUI(r.result);
        if(!mods||!mods.length){ eppFlash(t('Fichier XML non reconnu (OptionsUI.xml attendu).','Unrecognized XML file (OptionsUI.xml expected).'),{type:'err',timeout:3200}); return; }
        var prev={}; (getMods()||[]).forEach(function(m){ prev[(m.name||'').toLowerCase()]=m.variable; });

function dl(pairs){
  var d=el('dl',{class:'fiche-dl'});
  pairs.forEach(function(p){
    if(p[1]==null || p[1]==='' ) { d.appendChild(el('dt',{text:p[0]})); d.appendChild(el('dd',{class:'muted',text:t('Non renseigné','Not provided')})); }
    else { d.appendChild(el('dt',{text:p[0]})); var dd=el('dd'); if(p[2]==='html') dd.innerHTML=p[1]; else dd.textContent=p[1]; d.appendChild(dd); }
  });
  return d;
}
function sec(titleFr, titleEn, node, owners){
  var panel=el('div',{class:'panel fiche-sec'});
  var ph=el('div',{class:'panel-h',html:'<h3>'+esc(t(titleFr,titleEn))+'</h3>'});
  var ot=ownerTag(owners); if(ot){ ot.style.marginLeft='auto'; ot.classList.add('no-print'); ph.appendChild(ot); }
  panel.appendChild(ph);

  return panel;
}

/* Lit un .zip en navigateur (sans librairie) et renvoie le texte des entrees *.json. */
function extractZipJsons(buf){
  if(typeof DecompressionStream==='undefined') return Promise.reject(new Error('nozlib'));
  var dv=new DataView(buf), u8=new Uint8Array(buf);
  var eocd=-1, min=Math.max(0, u8.length-22-65536);
  for(var i=u8.length-22;i>=min;i--){ if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break; } }
  if(eocd<0) return Promise.reject(new Error('noeocd'));
  var cdCount=dv.getUint16(eocd+10,true), p=dv.getUint32(eocd+16,true), entries=[];
  for(var n=0;n<cdCount;n++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    var method=dv.getUint16(p+10,true), compSize=dv.getUint32(p+20,true),
        nameLen=dv.getUint16(p+28,true), extraLen=dv.getUint16(p+30,true), commentLen=dv.getUint16(p+32,true),
        lh=dv.getUint32(p+42,true);
    var name=new TextDecoder().decode(u8.subarray(p+46,p+46+nameLen));
    p+=46+nameLen+extraLen+commentLen;
    if(!/\.json$/i.test(name) || /\/$/.test(name)) continue;
    var lhNameLen=dv.getUint16(lh+26,true), lhExtraLen=dv.getUint16(lh+28,true);
    var ds=lh+30+lhNameLen+lhExtraLen;
    entries.push({method:method, data:u8.subarray(ds, ds+compSize)});
  }
  return Promise.all(entries.map(function(e){
    if(e.method===0) return Promise.resolve(new TextDecoder().decode(e.data));
    if(e.method===8) return new Response(new Blob([e.data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer().then(function(ab){ return new TextDecoder().decode(new Uint8Array(ab)); });
    return Promise.resolve('');
  })).then(function(arr){ return arr.filter(Boolean); });
}
function importFile(){
  var inp=el('input',{type:'file',accept:'.json,.zip,application/json,application/zip',multiple:'multiple',style:'display:none;'});
  inp.addEventListener('change',function(){
    var files=inp.files?[].slice.call(inp.files):[]; if(!files.length) return;
    var texts=[], errs=0, pending=files.length;
    function tick(){ if(--pending===0) finish(); }
    function finish(){
      var added=[];
      texts.forEach(function(txt){
        try{ var o=JSON.parse(txt); var acc=o&&o.account?o.account:(o&&o.group?o:null);
          if(acc&&acc.group){ acc=normalizeAccount(acc); acc.id=uid(); if(!acc.updatedAt) acc.updatedAt=Date.now();
            acc.history.push({ts:Date.now(),user:currentUserLabel(),action:'import',sections:[]});
            DB.accounts.push(acc); added.push(acc); } else errs++;
        }catch(e){ errs++; }
      });
      save();
      if(errs) eppFlash(errs+' '+t('élément(s) non reconnu(s) ou illisible(s).','item(s) not recognized or unreadable.'),{type:'err',timeout:3200});
      if(added.length===1){ eppFlash(t('Fiche importée.','Sheet imported.'),{type:'ok',timeout:2000}); openAccount(added[0],true); }
      else if(added.length>1){ eppFlash(added.length+' '+t('fiches importées.','sheets imported.'),{type:'ok',timeout:2600}); goHome(); }
      else if(!errs){ goHome(); }
    }
    files.forEach(function(f){
      if(/\.zip$/i.test(f.name) || (f.type||'').indexOf('zip')>=0){
        f.arrayBuffer().then(extractZipJsons).then(function(list){
          if(!list.length) errs++; list.forEach(function(x){ texts.push(x); });
        }).catch(function(){ errs++; eppFlash(t('Impossible de lire le .zip (dézippe et importe les .json).','Could not read the .zip (unzip and import the .json).'),{type:'err',timeout:3800}); }).then(tick);
      } else {
        var r=new FileReader();
        r.onload=function(){ texts.push(r.result); tick(); };
        r.onerror=function(){ errs++; tick(); };
        r.readAsText(f);
      }
    });
  });
  document.body.appendChild(inp); inp.click(); setTimeout(function(){ inp.remove(); },0);
}
/* Complete une fiche importée avec les champs manquants (compatibilite ascendante). */
function normalizeAccount(a){
  var b=blankAccount();
  a.id=a.id||b.id;
  a.group=Object.assign({},b.group,a.group||{});
  a.group.sfa=a.group.sfa||''; a.group.sfLink=a.group.sfLink||'';
  if(!Array.isArray(a.group.brands)||!a.group.brands.length) a.group.brands=[''];
  if(!Array.isArray(a.group.zones)||!a.group.zones.length) a.group.zones=[''];
  a.contacts=Array.isArray(a.contacts)&&a.contacts.length?a.contacts.map(function(c){ var cc=Object.assign(blankContact(),c); cc.scope=asList(cc.scope); return cc; }):[blankContact()];
  a.internal=Object.assign({},b.internal,a.internal||{}); if(!Array.isArray(a.internal.others)) a.internal.others=[];
  a.internal.csm=canonTeam(a.internal.csm,'csm'); a.internal.qm=canonTeam(a.internal.qm,'qm');
  // CSM connu + QM non defini -> QM par defaut correspondant (CSM_QM)
  if(a.internal.csm.length && !a.internal.qm.length){
    var _qs=[]; a.internal.csm.forEach(function(c){ var q=CSM_QM[c]; if(q && _qs.indexOf(q)<0) _qs.push(q); });
    if(_qs.length) a.internal.qm=_qs;
  }
  a.commercial=Object.assign({},b.commercial,a.commercial||{});
  if(!Array.isArray(a.commercial.prices)) a.commercial.prices=[];
  if(!Array.isArray(a.commercial.consumables)) a.commercial.consumables=[];
  a.deploy=Object.assign({},b.deploy,a.deploy||{});
  a.tech=Object.assign({},b.tech,a.tech||{});
  if(!Array.isArray(a.tech.vigilance)) a.tech.vigilance=[];
  if(!Array.isArray(a.tech.managerAccounts)) a.tech.managerAccounts=[];
  if(a.tech.moduleScope!=='zone') a.tech.moduleScope='common';
  if(!a.tech.zoneModules || typeof a.tech.zoneModules!=='object') a.tech.zoneModules={};
  a.locked=!!a.locked; a.lockedBy=a.lockedBy||''; a.lockedAt=a.lockedAt||0;
  if(a.tech.superAdminName||a.tech.superAdminEmail){ a.tech.managerAccounts.push({name:a.tech.superAdminName||'',email:a.tech.superAdminEmail||'',type:'super'}); }
  delete a.tech.superAdminName; delete a.tech.superAdminEmail;
  // Migration : ancienne liste variableModules -> modules {name, variable:true}
  if(!Array.isArray(a.tech.modules)){
    if(Array.isArray(a.tech.variableModules)) a.tech.modules=a.tech.variableModules.filter(Boolean).map(function(nm){ return {name:nm,key:'',variable:true}; });
    else a.tech.modules=[];
  }
  delete a.tech.variableModules;
  if(!Array.isArray(a.history)) a.history=[];
  return a;
}

/* Semence / re-semence versionnee : installe les fiches fournies (window.EPP_SEED) et,
   a chaque bump de version (EPP_SEED_V), remplace les fiches de DEMO par la nouvelle base,
   en preservant les vraies fiches creees par l'utilisateur. */
function seedAccounts(){
  return (window.EPP_SEED||[]).map(function(a){
    var acc=normalizeAccount(JSON.parse(JSON.stringify(a))); acc.id=uid(); acc._seed=true; return acc;
  });
}
function acctNameKey(a){ return nameKey((a&&a.group&&a.group.name)||''); }
function acctScore(a){
  try{
    var zc=(a.group&&a.group.multiZone&&Array.isArray(a.group.zones))?a.group.zones.filter(Boolean).length:0;
    var cc=Array.isArray(a.contacts)?a.contacts.filter(function(c){return c.email||c.lastName;}).length:0;
    return progress(a)*1000000 + zc*20000 + cc*2000 + JSON.stringify(a).length;
  }catch(e){ return 0; }
}
/* Supprime les doublons de fiches (meme nom de groupe), en gardant la plus complete.
   Corrige notamment un seed re-ajoute a cote d'une ancienne version du meme groupe. */
function dedupeAccounts(){
  var seen={}, out=[], changed=false;
  (DB.accounts||[]).forEach(function(a){
    var k=acctNameKey(a);
    if(!k){ out.push(a); return; }
    if(!(k in seen)){ seen[k]=out.length; out.push(a); return; }
    changed=true; var i=seen[k];
    if(acctScore(a) > acctScore(out[i])) out[i]=a; // garde la fiche la plus remplie
  });
  if(changed){ DB.accounts=out; save(); }
}
function maybeSeed(){
  var target=String(window.EPP_SEED_V||'1');
  var v=''; try{ v=localStorage.getItem('eppGCSeedV')||''; }catch(e){}
  var seededFlag=false; try{ seededFlag=localStorage.getItem('eppGCSeeded')==='1'; }catch(e){}
  if(v===target && seededFlag) return; // deja a jour
  try{ localStorage.setItem('eppGCSeedV', target); localStorage.setItem('eppGCSeeded','1'); }catch(e){}
  var seeded=seedAccounts();
  var seedKeys={}; seeded.forEach(function(a){ seedKeys[acctNameKey(a)]=1; });
  var oldKeys={}; (window.EPP_OLD_NAMES||[]).forEach(function(n){ oldKeys[nameKey(n)]=1; });
  // On garde UNIQUEMENT les fiches creees par l'utilisateur (nom hors seed, hors demo, non _seed).
  var kept=(DB.accounts||[]).filter(function(a){
    if(a._seed) return false;                       // ancien seed
    var k=acctNameKey(a);
    if(oldKeys[k]) return false;                    // ancienne demo
    if(seedKeys[k]) return false;                   // meme nom qu'un groupe du seed -> evite le doublon
    return true;
  });
  DB.accounts=seeded.concat(kept);
  save();
}

window.EPP_ON_LANG=function(){ renderAll(); };
function boot(){
  load();
  // Recale les fiches deja stockees (noms CSM/QM, defauts) puis persiste si besoin.
  if(DB.accounts && DB.accounts.length){
    var before=JSON.stringify(DB.accounts);
    DB.accounts=DB.accounts.map(function(a){ return normalizeAccount(a); });
    try{ if(JSON.stringify(DB.accounts)!==before) save(); }catch(e){ save(); }
  }
  maybeSeed();
  dedupeAccounts(); // filet de securite : supprime d'eventuels doublons de meme nom
  var first=false; try{ first=localStorage.getItem('eppGCUser')===null; }catch(e){ first=true; }
  var br=document.querySelector('.brand'); if(br) br.addEventListener('click',function(e){ e.preventDefault(); goHome(); });
  buildIdentityPicker();
  renderAll();
  window.addEventListener('scroll', adjustTopBtn, true);
  window.addEventListener('resize', adjustTopBtn);
  setTimeout(adjustTopBtn, 60); // le FAB du socle peut etre cree juste apres
  if(first) askIdentity();
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', function(){ setTimeout(boot,0); });
else setTimeout(boot,0);

})();

</script>
</body>
</html>
