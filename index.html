function exportModulesPng(acc){
  var mods=(acc.tech.modules||[]).filter(function(m){ return m.name; });
  if(!mods.length){ eppFlash(t('Aucun module a exporter. Importe un OptionsUI.xml.','No module to export. Import an OptionsUI.xml.'),{type:'warn',timeout:2600}); return; }
  var svg=buildModulesSvg(acc);
  var url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml;charset=utf-8'}));
  var img=new Image();
  img.onload=function(){
    var scale=2, c=el('canvas'); c.width=img.width*scale; c.height=img.height*scale;
    var ctx=c.getContext('2d'); ctx.scale(scale,scale); ctx.drawImage(img,0,0); URL.revokeObjectURL(url);
    try{
      c.toBlob(function(png){ if(!png){ eppFlash(t('Export image impossible.','Image export failed.'),{type:'err',timeout:2600}); return; }
        var u=URL.createObjectURL(png); var a=el('a',{href:u,download:'modules-'+slug(acc.group.name)+'.png'});
        document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(u); },1000);
        eppFlash(t('Image des modules exportee (PNG).','Modules image exported (PNG).'),{type:'ok',timeout:2200});
      },'image/png');
    }catch(e){ eppFlash(t('Export image impossible.','Image export failed.'),{type:'err',timeout:2600}); }
  };
  img.onerror=function(){ URL.revokeObjectURL(url); eppFlash(t('Export image impossible.','Image export failed.'),{type:'err',timeout:2600}); };
  img.src=url;
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

/* Une etape est-elle "remplie" (pour la coche de progression) ? */
function stepFilled(i){
  if(!CUR) return false;
  var g=CUR.group;
  switch(i){
    case 0: return !!(g.name&&g.name.trim());
    case 1: return CUR.contacts.some(function(c){ return c.lastName||c.firstName||c.email||c.phone; });
    case 2: var n=CUR.internal; return !!(n.qm||n.csm||n.cp||n.sales||n.others.length);
    case 3: var c=CUR.commercial; return !!(c.frameContract||c.priceRef||c.prices.length||c.consumables.length||c.consumableNote||c.history);
    case 4: var d=CUR.deploy; return !!(d.sitesEquipped||d.sitesToEquip||d.cadence||d.planningUrl||d.refSite);
    case 5: var te=CUR.tech; return !!(te.paramTypeUrl||(te.modules&&te.modules.length)||(te.managerAccounts&&te.managerAccounts.length)||te.updateAccount||te.listingUrl||te.vigilance.length||te.note);
  }
  return false;
}
function progress(acc){ var n=0; var save2=CUR; CUR=acc; for(var i=0;i<=LAST_FORM;i++) if(stepFilled(i)) n++; CUR=save2; return n; }

/* Switch Oui/Non reutilisant le socle (.epp-switch-onoff). */
function ynRow(qFr, qEn, subFr, subEn, val, onToggle){
  var row=el('div',{class:'yn'});
  var txt=el('div',{class:'yn-txt'});
  txt.appendChild(el('div',{class:'yn-q',text:t(qFr,qEn)}));
  if(subFr) txt.appendChild(el('div',{class:'yn-sub',text:t(subFr,subEn)}));
  row.appendChild(txt);
  var ctl=el('div',{class:'yn-ctl'});
  var state=el('span',{class:'yn-state'+(val?' on':''),text:val?t('Oui','Yes'):t('Non','No')});
  var sw=el('div',{class:'epp-switch epp-switch-onoff'+(val?' epp-on':''),role:'switch',tabindex:'0','aria-checked':val?'true':'false'});
  sw.innerHTML='<span class="epp-knob"></span>';
  function toggle(){ onToggle(!val); }
  sw.addEventListener('click',toggle);
  sw.addEventListener('keydown',function(e){ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); toggle(); } });
  ctl.appendChild(state); ctl.appendChild(sw);
  row.appendChild(ctl);
  return row;
}

function dl(pairs){
  var d=el('dl',{class:'fiche-dl'});
  pairs.forEach(function(p){
    if(p[1]==null || p[1]==='' ) { d.appendChild(el('dt',{text:p[0]})); d.appendChild(el('dd',{class:'muted',text:t('Non renseigne','Not provided')})); }
    else { d.appendChild(el('dt',{text:p[0]})); var dd=el('dd'); if(p[2]==='html') dd.innerHTML=p[1]; else dd.textContent=p[1]; d.appendChild(dd); }
  });
  return d;
}
function sec(titleFr, titleEn, node, owners){
  var panel=el('div',{class:'panel fiche-sec'});
  var ph=el('div',{class:'panel-h',html:'<h3>'+esc(t(titleFr,titleEn))+'</h3>'});
  var ot=ownerTag(owners); if(ot){ ot.style.marginLeft='auto'; ot.classList.add('no-print'); ph.appendChild(ot); }
  panel.appendChild(ph);
  var b=el('div',{class:'panel-b'}); b.appendChild(node); panel.appendChild(b);
  return panel;
}

      var chip=ac.type==='super'?('<span class="chip mod-req">Super Admin</span>'):('<span class="chip">'+esc(acctLabel(ac.type))+'</span>');
      var email=ac.email?('<a class="link-ext" href="mailto:'+esc(ac.email)+'">'+esc(ac.email)+'</a>'):'-';
      var src=ac.source==='contact'?t('Contact siege','HQ contact'):t('Autre','Other');
      var tr=el('tr'); tr.innerHTML='<td><b>'+esc(ac.name)+'</b></td><td>'+email+'</td><td>'+chip+'</td><td>'+esc(src)+'</td>'; ab.appendChild(tr);
    });
    at.appendChild(ab); techWrap.appendChild(at);
  } else techWrap.appendChild(el('div',{class:'empty-note',text:t('Aucun compte manager renseigne.','No manager account provided.')}));
  var upEmail = te.updateAccount ? ('<a class="link-ext" href="mailto:'+esc(te.updateAccount)+'">'+esc(te.updateAccount)+'</a>') : null;
  techWrap.appendChild(dl([[t('Compte Update ePack','ePack Update account'), upEmail, upEmail?'html':null]]));
  // Listing
  var liLink = te.listingUrl ? ('<a class="link-ext" href="'+esc(te.listingUrl)+'" target="_blank" rel="noopener">'+esc(te.listingUrl)+'</a>') : null;
  techWrap.appendChild(dl([[t('Listing Excel / Rapport d\'intervention','Excel listing / Intervention report'), liLink, liLink?'html':null]]));
  // Points de vigilance
  techWrap.appendChild(el('div',{class:'sub-h',style:'margin:6px 0 0;',text:t('Points de vigilance','Points of attention')}));
  if(te.vigilance.filter(function(p){return p.text;}).length){
    var ul=el('ul',{class:'vig-list'});
    te.vigilance.filter(function(p){return p.text;}).forEach(function(p){
      var cls=p.level==='crit'?'lv-crit':(p.level==='imp'?'lv-imp':'lv-info');
      var lab=p.level==='crit'?t('Critique','Critical'):(p.level==='imp'?t('Important','Important'):t('Info','Info'));
      var li=el('li'); li.innerHTML='<span class="chip '+cls+'">'+esc(lab)+'</span><span>'+esc(p.text)+'</span>'; ul.appendChild(li);
    });
    techWrap.appendChild(ul);
  } else techWrap.appendChild(el('div',{class:'empty-note',text:t('Aucun point de vigilance.','No point of attention.')}));
  if(te.note) techWrap.appendChild(dl([[t('Autres consignes','Other instructions'), te.note]]));
  fiche.appendChild(sec('Technique & parametrages','Technical & setup', techWrap, STEP_OWNERS[5]));

  c.appendChild(fiche);
}
function priceRecap(arr, withCat){
  var items=arr.filter(function(p){ return p.label||p.price; });
  if(!items.length) return el('div',{class:'empty-note',text:t('Aucune ligne renseignee.','No line provided.')});
  var tbl=el('table',{class:'mini-tbl'});
  var head='<tr>'+(withCat?('<th style="width:130px;">'+esc(t('Categorie','Category'))+'</th>'):'')+'<th>'+esc(t('Designation','Item'))+'</th><th style="width:150px;">'+esc(t('Tarif','Price'))+'</th><th>'+esc(t('Remarque','Note'))+'</th></tr>';
  tbl.innerHTML='<thead>'+head+'</thead>';
  var tb=el('tbody');
  var catL={materiel:t('Materiel','Hardware'),option:t('Option','Option'),accessoire:t('Accessoire','Accessory')};
  items.forEach(function(p){
    var tr=el('tr');
    tr.innerHTML=(withCat?('<td>'+esc(catL[p.cat]||'-')+'</td>'):'')+'<td><b>'+esc(p.label||'-')+'</b></td><td>'+esc(p.price||'-')+'</td><td>'+esc(p.note||'')+'</td>';
    tb.appendChild(tr);
  });
  tbl.appendChild(tb); return tbl;
}

/* =========================================================================
   IMPORT / EXPORT / SUPPRESSION
   ========================================================================= */
function exportAccount(a){
  var payload={ app:'epackpro-grands-comptes', type:'fiche', version:1, exportedAt:new Date().toISOString(), account:a };
  var blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var name=(a.group.name||'grand-compte').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'grand-compte';
  var link=el('a',{href:url,download:'fiche-'+name+'.json'});
  document.body.appendChild(link); link.click(); document.body.removeChild(link);
  setTimeout(function(){ URL.revokeObjectURL(url); },1000);
}
function importFile(){
  var inp=el('input',{type:'file',accept:'.json,application/json',style:'display:none;'});
  inp.addEventListener('change',function(){
    var f=inp.files&&inp.files[0]; if(!f) return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var o=JSON.parse(r.result);
        var acc = o&&o.account ? o.account : (o&&o.group ? o : null);
        if(!acc||!acc.group){ eppFlash(t('Fichier non reconnu.','Unrecognized file.'),{type:'err',timeout:3000}); return; }
        acc=normalizeAccount(acc);
        acc.id=uid(); acc.updatedAt=Date.now();
        DB.accounts.push(acc); save();
        eppFlash(t('Fiche importee.','Sheet imported.'),{type:'ok',timeout:2000});
        openAccount(acc,true);
      }catch(e){ eppFlash(t('Fichier illisible (JSON invalide).','Unreadable file (invalid JSON).'),{type:'err',timeout:3000}); }
    };
    r.readAsText(f);
  });
  document.body.appendChild(inp); inp.click(); setTimeout(function(){ inp.remove(); },0);
}
/* Complete une fiche importee avec les champs manquants (compatibilite ascendante). */
function normalizeAccount(a){
  var b=blankAccount();
  a.id=a.id||b.id;
  a.group=Object.assign({},b.group,a.group||{});
  if(!Array.isArray(a.group.brands)||!a.group.brands.length) a.group.brands=[''];
  if(!Array.isArray(a.group.zones)||!a.group.zones.length) a.group.zones=[''];
  a.contacts=Array.isArray(a.contacts)&&a.contacts.length?a.contacts.map(function(c){ return Object.assign(blankContact(),c); }):[blankContact()];
  a.internal=Object.assign({},b.internal,a.internal||{}); if(!Array.isArray(a.internal.others)) a.internal.others=[];
  a.commercial=Object.assign({},b.commercial,a.commercial||{});
  if(!Array.isArray(a.commercial.prices)) a.commercial.prices=[];
  if(!Array.isArray(a.commercial.consumables)) a.commercial.consumables=[];
  a.deploy=Object.assign({},b.deploy,a.deploy||{});
  a.tech=Object.assign({},b.tech,a.tech||{});
  if(!Array.isArray(a.tech.vigilance)) a.tech.vigilance=[];
  if(!Array.isArray(a.tech.managerAccounts)) a.tech.managerAccounts=[];
  if(a.tech.superAdminName||a.tech.superAdminEmail){ a.tech.managerAccounts.push({name:a.tech.superAdminName||'',email:a.tech.superAdminEmail||'',type:'super'}); }
  delete a.tech.superAdminName; delete a.tech.superAdminEmail;
  // Migration : ancienne liste variableModules -> modules {name, variable:true}
  if(!Array.isArray(a.tech.modules)){
    if(Array.isArray(a.tech.variableModules)) a.tech.modules=a.tech.variableModules.filter(Boolean).map(function(nm){ return {name:nm,key:'',variable:true}; });
    else a.tech.modules=[];
  }
  delete a.tech.variableModules;
  return a;
}
function askDelete(a){
  confirmBox(t('Supprimer cette fiche ?','Delete this sheet?'),
    t('La fiche "'+(a.group.name||'(sans nom)')+'" sera definitivement supprimee de ce navigateur. Pense a l\'exporter avant si besoin.',
      'The sheet "'+(a.group.name||'(untitled)')+'" will be permanently removed from this browser. Export it first if needed.'),
    t('Supprimer','Delete'), function(){
      var i=DB.accounts.indexOf(a); if(i>=0) DB.accounts.splice(i,1); save();
      if(CUR===a){ CUR=null; VIEW='home'; }
      renderAll();
      eppFlash(t('Fiche supprimee.','Sheet deleted.'),{type:'ok',timeout:1800});
    });
}

/* ---------- Confirmation maison (reutilise .epp-modal) ---------- */
function confirmBox(title, msg, okLabel, onOk){
  var ov=el('div',{class:'epp-modal-ov open'});
  var modal=el('div',{class:'epp-modal',role:'dialog','aria-modal':'true'});
  var head=el('div',{class:'em-head'});
  head.innerHTML='<h4>'+esc(title)+'</h4>';
  var close=el('button',{class:'em-close','aria-label':'Fermer',html:'&#10005;'});
  head.appendChild(close);
  var body=el('div',{class:'em-body'});
  body.appendChild(el('div',{class:'confirm-body',text:msg}));
  var foot=el('div',{class:'confirm-foot'});
  var cancel=el('button',{class:'btn btn-ghost',text:t('Annuler','Cancel')});
  var ok=el('button',{class:'btn btn-rouge',text:okLabel});
  foot.appendChild(cancel); foot.appendChild(ok); body.appendChild(foot);
  modal.appendChild(head); modal.appendChild(body); ov.appendChild(modal); document.body.appendChild(ov);
  function done(){ ov.remove(); }
  close.onclick=cancel.onclick=done;
  ov.addEventListener('click',function(e){ if(e.target===ov) done(); });
  ok.onclick=function(){ done(); onOk(); };
  document.addEventListener('keydown',function esc2(e){ if(e.key==='Escape'){ done(); document.removeEventListener('keydown',esc2); } });
}

/* ---------- Identite dans le header (definit la vue / role) ---------- */
function buildIdentityPicker(){
  var cluster=document.querySelector('.top .cluster'); if(!cluster || document.getElementById('idPick')) return;
  var wrap=el('div',{class:'id-pick',id:'idPick',title:t('Qui es-tu ? (definit ta vue)','Who are you? (sets your view)')});
  wrap.innerHTML='<svg class="ico sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>';
  var sel=el('select',{class:'field id-sel','aria-label':'Identite'});
  var curVal = USER.name ? USER.name : (USER.role==='sales'?'_sales':USER.role==='cp'?'_cp':'all');
  function opt(v,l){ var o=el('option',{value:v,text:l}); if(v===curVal) o.selected=true; return o; }
  sel.appendChild(opt('all', t('Vue complete (tous)','Full view (all)')));
  var gq=el('optgroup',{label:'QM'}); PEOPLE.filter(function(p){return p.role==='qm';}).forEach(function(p){ gq.appendChild(opt(p.name,p.name)); }); sel.appendChild(gq);
  var gc=el('optgroup',{label:'CSM'}); PEOPLE.filter(function(p){return p.role==='csm';}).forEach(function(p){ gc.appendChild(opt(p.name,p.name)); }); sel.appendChild(gc);
  var go=el('optgroup',{label:t('Autres','Other')}); go.appendChild(opt('_sales','Sales')); go.appendChild(opt('_cp','CP (Customer Planner)')); sel.appendChild(go);
  sel.addEventListener('change',function(){
    var v=sel.value;
    if(v==='all') setUser('','all');
    else if(v==='_sales') setUser('','sales');
    else if(v==='_cp') setUser('','cp');
    else { var p=null; PEOPLE.forEach(function(x){ if(x.name===v) p=x; }); setUser(v, p?p.role:'all'); }
  });
  wrap.appendChild(sel);
  cluster.insertBefore(wrap, cluster.firstChild);
}

window.EPP_ON_LANG=function(){ renderAll(); };
function boot(){
  load();
  var br=document.querySelector('.brand'); if(br) br.addEventListener('click',function(e){ e.preventDefault(); goHome(); });
  buildIdentityPicker();
  renderAll();
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', function(){ setTimeout(boot,0); });
else setTimeout(boot,0);

})();
